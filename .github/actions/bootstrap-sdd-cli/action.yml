name: Bootstrap SDD CLI
description: Initialize SDD workspace using uv (uv must already be installed)

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"
        cache: true
        cache-dependency-path: tools/sdd-compile/go.sum

    - name: Install all dependencies (includes sdd-compile build)
      shell: bash
      run: make install

    - name: Verify CLI module
      shell: bash
      run: uv run python -m sdd_cli --help > /dev/null

    - name: Initialize SDD Workspace
      shell: bash
      run: uv run python -m sdd_cli init --type master --force

    - name: Compile governance artifacts
      shell: bash
      run: uv run python -m sdd_cli governance compile

    - name: Verify compiled artifacts exist
      shell: bash
      run: |
        test -f .sdd/compiled/governance-core.json || \
          (echo "ERROR: .sdd/compiled/governance-core.json missing" && exit 1)
        test -f .sdd/compiled/governance-core.compiled.msgpack || \
          (echo "ERROR: .sdd/compiled/governance-core.compiled.msgpack missing" && exit 1)
        echo "✓ Compiled artifacts verified at .sdd/compiled/."
