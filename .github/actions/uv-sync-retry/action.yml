name: uv sync (retry)
description: Run `uv sync` with retry, optionally preceded by `uv venv` and followed by editable installs, matching this repo's existing retry policy (3 attempts, backoff).

inputs:
  sync-args:
    description: >-
      Arguments passed to `uv sync`. Includes `--all-packages` by default so
      every uv workspace member (e.g. `sdd_wizard`, not referenced by the
      root project's own `[project.dependencies]`) gets installed — without
      it, `--all-groups` alone silently omits workspace members the root
      doesn't directly depend on, which caused `mypy`/other whole-tree tools
      to fail to resolve their imports in CI while passing locally (see
      `.analysis/refined/20260807-ci-mypy-gate-wiring-fix/`, closed missing
      this case).
    required: false
    default: "--all-groups --all-packages"
  editable-packages:
    description: Newline-separated list of paths to `uv pip install -e`, run after a successful sync. Empty = skip.
    required: false
    default: ""
  create-venv:
    description: Run `uv venv` before syncing (needed when no venv exists yet, e.g. release jobs)
    required: false
    default: "false"
  retry-backoff-seconds:
    description: Multiplier for the retry backoff (sleep = attempt * this value)
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - name: uv sync with retry
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if { [ "${{ inputs.create-venv }}" != "true" ] || uv venv; } \
             && uv sync ${{ inputs.sync-args }}; then
            break
          fi
          if [[ "${attempt}" -lt 3 ]]; then
            sleep $((attempt * ${{ inputs.retry-backoff-seconds }}))
          else
            exit 1
          fi
        done
        if [ -n "${{ inputs.editable-packages }}" ]; then
          shopt -s extglob
          install_editable() {
            local pkg="$1"
            for attempt in 1 2 3; do
              echo "Installing editable package: ${pkg} (attempt ${attempt}/3)"
              if uv pip install -e "$pkg"; then
                return 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                sleep $((attempt * ${{ inputs.retry-backoff-seconds }}))
              else
                echo "ERROR: failed to install editable package after retries: ${pkg}" >&2
                return 1
              fi
            done
          }
          while IFS= read -r pkg; do
            pkg="${pkg##+([[:space:]])}"
            pkg="${pkg%%+([[:space:]])}"
            [ -z "$pkg" ] && continue
            install_editable "$pkg"
          done <<< "${{ inputs.editable-packages }}"
        fi
