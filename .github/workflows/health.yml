name: Health Orchestrator

on:
  push:
    branches: [main, dev, develop]
    paths-ignore:
      - "site/**"
      - "docs/**"
  pull_request:
    branches: [main, dev, develop]

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  branch-policy:
    name: Branch Promotion Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce DEV -> MAIN promotion rule
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${GH_EVENT_NAME}" != "pull_request" ]; then
            echo "Non-PR event: skipping strict promotion source check."
            exit 0
          fi

          base_branch="${GH_BASE_REF}"
          head_branch="${GH_HEAD_REF}"

          if [ "${base_branch}" = "main" ] && [ "${head_branch}" != "dev" ] && [ "${head_branch}" != "develop" ]; then
            echo "ERROR: Promotion to 'main' must come from 'dev' or 'develop'."
            echo "Received: ${head_branch} -> ${base_branch}"
            exit 1
          fi

          echo "Branch promotion policy passed (${head_branch} -> ${base_branch})."

  environment-preflight:
    name: Environment Boundary Preflight
    needs: [branch-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v5
        with:
          version: "latest"
          cache: true
      - name: Run environment boundary gates (health)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py env-boundary-lint --context health --mode enforce
          uv run python tools/ci/environment_gates.py workspace-root-resolution-check --mode enforce

  lint:
    needs: [branch-policy, environment-preflight]
    uses: ./.github/workflows/reusable-lint.yml

  security:
    needs: [lint]
    uses: ./.github/workflows/reusable-security.yml

  tests:
    needs: [lint]
    uses: ./.github/workflows/reusable-test.yml

  governance:
    needs: [tests, security]
    uses: ./.github/workflows/reusable-governance.yml

  scorecard:
    name: Artifact Quality Scorecard
    needs: [branch-policy, lint, security, tests, governance]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate Summary
        shell: bash
        run: |
          echo "## 🛡️ Sovereign Factory: Quality Scorecard" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "| Dimension | Status | Notes |"
          echo "|---|---|---|"
          echo "| **Branch Policy** | ${{ needs.branch-policy.result == 'success' && '✅ PASS' || '❌ FAIL' }} | only DEV -> MAIN promotion |"
          echo "| **Linting** | ${{ needs.lint.result == 'success' && '✅ PASS' || '❌ FAIL' }} | ruff, hadolint |"
          echo "| **Security** | ${{ needs.security.result == 'success' && '✅ PASS' || '❌ FAIL' }} | bandit, trivy |"
          echo "| **Artifact Gate** | ${{ needs.tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | contract/golden consistency |"
          echo "| **CLI Gate** | ${{ needs.tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | windows/linux + encoding/snapshots |"
          echo "| **Skills/Commands Gate** | ${{ needs.tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | registry/prompt/policy enforcement |"
          echo "| **Seeds Gate** | ${{ needs.tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} | generation/idempotency/fingerprint |"
          echo "| **Governance Compliance** | ${{ needs.governance.result == 'success' && '✅ PASS' || '❌ FAIL' }} | P003 (Ed25519), compile, audit |"
          echo ""
          if [ "${{ needs.governance.result }}" == "success" ]; then
            echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
            echo "> Artifact is compliant and ready for Sovereign Factory assembly." >> $GITHUB_STEP_SUMMARY
          else
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> Governance breach detected. Artifact integrity cannot be guaranteed." >> $GITHUB_STEP_SUMMARY
          fi
