name: Reusable Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy + bandit)
    runs-on: ubuntu-latest
    # Was 5 when this job only ran global `ruff check`/`ruff format --check`.
    # tools/maintenance/lint_all.py adds per-layer ruff, mypy over the whole
    # tree, and bandit — a real increase in wall-clock cost, not just scope.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.9"
          enable-cache: true
      - name: Initialize UV workspace (retry)
        uses: ./.github/actions/uv-sync-retry
      - name: Analyze text I/O encoding policy (baseline migration)
        run: uv run python tools/ci/check_text_io_encoding.py || true
      # Canonical convergence (ADR reference:
      # .analysis/refined/20260807-ci-mypy-gate-wiring-fix/): this is the same
      # script `make lint` runs locally — CI and local dev can no longer
      # silently diverge on what "lint" means. Runs ruff per layer, mypy
      # (pyproject.toml's declared canonical type-checking gate — previously
      # never wired into CI), and bandit.
      - name: Run lint (ruff + mypy + bandit)
        run: uv run python tools/maintenance/lint_all.py

  dockerfile:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: infrastructure/docker/Dockerfile
          ignore: DL3008
