name: Reusable Lint

on:
  workflow_call:

jobs:
  ruff:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v5
        with:
          version: "latest"
          cache: true
      - name: Initialize UV workspace (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uv sync --all-groups; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Run ruff check
        run: uv run ruff check .
      - name: Analyze text I/O encoding policy (baseline migration)
        run: uv run python tools/ci/check_text_io_encoding.py || true
      - name: Run ruff format check
        run: uv run ruff format . --check

  dockerfile:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: infrastructure/docker/Dockerfile
          ignore: DL3008
