name: SDD Mandate Validation

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

concurrency:
  group: sdd-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mandate-validation:
    name: Validate SDD Governance Mandates
    runs-on: ubuntu-latest
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history so the TDD diff-coverage gate can diff against the
          # PR base ref (default checkout is shallow, depth 1).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v5
        with:
          version: "latest"
          cache: true

      - name: Bootstrap SDD CLI
        uses: ./.github/actions/bootstrap-sdd-cli

      - name: Enforce CI command policy
        shell: bash
        run: |
          uv run python tools/ci/check_no_sdd_ci_commands.py
          uv run python tools/ci/check_no_compliance_bypass.py
          uv run python tools/ci/check_governance_mandatory_lanes.py
          uv run python tools/ci/check_no_legacy_ai_paths.py

      - name: Validate governance structure (M001 - Clean Architecture)
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Validating Clean Architecture (M001)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Validate governance artifacts are properly structured
          uv run python -m sdd_cli governance validate --skip-handshake

          echo "✓ M001 Clean Architecture validated."

      - name: Validate Test Coverage (M002 - TDD)
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Validating Test-Driven Development (M002)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Check that tests exist and are discoverable
          TEST_COUNT=$(find packages tests -name "test_*.py" -o -name "*_test.py" | wc -l)
          if [ "$TEST_COUNT" -lt 10 ]; then
            echo "⚠ Warning: Only $TEST_COUNT test files found (expected ≥10)"
          else
            echo "✓ Found $TEST_COUNT test files"
          fi

          # Per-change diff gate: flags PRs that change production code without
          # touching any test file. Starts at warn (new gate, per the project's
          # own WARN -> BLOCK -> STRICT enforcement-ladder convention); promote
          # to --mode enforce once false-block rate is observed to be low.
          uv run python tools/ci/check_tdd_diff_coverage.py --mode warn

          echo "✓ M002 Test-Driven Development validated."

      - name: Validate Context Awareness (M003 - Context Caching)
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Validating Context Awareness (M003)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Verify SDD cache exists
          if [ -f ".sdd/runtime/.sdd-cache.md" ]; then
            echo "✓ SDD context cache found"
          else
            echo "⚠ Warning: SDD cache not found (.sdd/runtime/.sdd-cache.md)"
          fi

          echo "✓ M003 Context Awareness validated."

      - name: Validate Token Economy Enforcement (M005)
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Validating Token Economy Enforcement (M005)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Run compliance checks for token economy
          uv run pytest \
            packages/core/sdd_runtime/tests/test_circuit_breaker.py \
            -v --tb=short -q

          echo "✓ M005 Token Economy Enforcement validated."

      - name: Run compliance verification
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Final Compliance Check"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Verify governance compliance with all mandates
          python3 tools/governance/compliance.py . --verify

          echo "✓ All SDD mandates validated."
