name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse-tag.outputs.version }}
      tag: ${{ steps.parse-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate semver tag format
        id: parse-tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '$TAG' does not match semver format vX.Y.Z or VX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.9"

      - name: Install dependencies
        uses: ./.github/actions/uv-sync-retry
        with:
          create-venv: "true"
          retry-backoff-seconds: "15"
          editable-packages: |
            packages/core/sdd_core
            packages/core/sdd_telemetry
            packages/features/sdd_skills
            packages/core/sdd_runtime
            packages/features/sdd_adapters
            packages/features/sdd_integration
            packages/features/sdd_pages
            packages/interfaces/sdd_wizard
            packages/interfaces/sdd_cli

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Build sdd-compile binary
        shell: bash
        run: make build-compiler

      - name: Run tests
        shell: bash
        run: uv run pytest tests/unit tests/integration -q --tb=short

      - name: Enforce golden snapshot policy (strict)
        shell: bash
        run: uv run python tools/ci/check_golden_policy.py --mode strict

      - name: Validate release readiness v1 checklist
        shell: bash
        run: uv run python tools/ci/check_release_readiness_v1.py

      - name: Verify version matches tag
        shell: bash
        run: |
          # The root package uses hatch-vcs; the release tag is the version authority.
          PKG_VERSION=$(uv run python -m tools.release.resolve_vcs_version)
          echo "Resolved version: $PKG_VERSION"
          echo "Tag version:     $VERSION"
          if [ "${PKG_VERSION%%+*}" != "$VERSION" ]; then
            echo "ERROR: resolved version ($PKG_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

  build:
    name: Build Distribution
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      artifact-name: dist

  release-install-smoke:
    name: Release Install Smoke (${{ matrix.os }})
    needs: [validate, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Create install smoke venv
        shell: bash
        run: python -m venv .release-smoke

      - name: Install sdd-cli from dist only (no PyPI fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --no-index --find-links dist sdd-cli

      - name: Upgrade/rollback smoke
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_NEW_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi

          # The tag this run is building for has no GitHub Release yet (the
          # `release` job that creates it runs after this one) — so "latest"
          # is guaranteed to be the previous published version, giving a real
          # N-1 artifact to upgrade from and roll back to, without hardcoding
          # a version number here.
          mkdir -p .release-smoke/prev
          # PREV_TAG/PREV_WHEEL_NAME/PREV_WHEEL_URL are only needed later in
          # THIS SAME step — $GITHUB_ENV changes apply to subsequent steps
          # only, never the step that writes them, so writing there and then
          # reading "$PREV_WHEEL_NAME" below always failed with "unbound
          # variable" under `set -u` (on every OS, not just Windows — this
          # path was simply never exercised by a real release before v1.0.5).
          # Capture directly into this shell instead via a local env file.
          python3 - > .release-smoke/prev.env <<'PYEOF'
          import json
          import os
          import urllib.request

          url = (
              "https://api.github.com/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/releases/latest"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          wheel = next(
              (
                  asset
                  for asset in release["assets"]
                  if asset["name"].startswith("sdd_cli-") and asset["name"].endswith(".whl")
              ),
              None,
          )
          if wheel is None:
              raise SystemExit(
                  f"No sdd_cli-*.whl asset found on release {release['tag_name']}"
              )

          print(f"PREV_TAG={release['tag_name']}")
          print(f"PREV_WHEEL_NAME={wheel['name']}")
          print(f"PREV_WHEEL_URL={wheel['browser_download_url']}")
          PYEOF

          cat .release-smoke/prev.env
          set -a
          source .release-smoke/prev.env
          set +a

          echo "Downloading previous release wheel: $PREV_WHEEL_NAME ($PREV_TAG)"
          curl -sSL -o ".release-smoke/prev/$PREV_WHEEL_NAME" "$PREV_WHEEL_URL"

          PREV_VERSION="${PREV_TAG#v}"
          PREV_VERSION="${PREV_VERSION#V}"

          echo "--- Install previous release ($PREV_VERSION) ---"
          # sdd-cli is already installed at the new dist version from the
          # earlier "Install sdd-cli from dist only" step, so plain `pip
          # install` sees the requirement as already satisfied and skips —
          # it never downgrades without --force-reinstall.
          # --no-deps is required alongside it: .release-smoke/prev only has
          # the single downloaded sdd-cli wheel, not a full dependency
          # closure like dist/ does (reusable-release-build.yml's `pip
          # download` step vendors every transitive wheel there) — without
          # --no-deps, --force-reinstall also tries to reinstall click/
          # pyyaml/rich/etc. from that same directory and fails to find them
          # ("No matching distribution found for click>=8.3.3"). sdd-cli's
          # own version is all this smoke test verifies, so skipping its
          # dependency tree here is correct, not a shortcut.
          "$PY" -m pip install --no-index --find-links .release-smoke/prev --force-reinstall --no-deps sdd-cli
          INSTALLED=$("$PY" -m pip show sdd-cli | grep -i '^Version:' | awk '{print $2}')
          if [ "$INSTALLED" != "$PREV_VERSION" ]; then
            echo "ERROR: expected previous version $PREV_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "OK: previous version installed ($INSTALLED)"

          echo "--- Upgrade to this release ($EXPECTED_NEW_VERSION) ---"
          "$PY" -m pip install --no-index --find-links dist --upgrade sdd-cli
          INSTALLED=$("$PY" -m pip show sdd-cli | grep -i '^Version:' | awk '{print $2}')
          if [ "$INSTALLED" != "$EXPECTED_NEW_VERSION" ]; then
            echo "ERROR: expected upgraded version $EXPECTED_NEW_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "OK: upgrade succeeded ($INSTALLED)"

          echo "--- Roll back to previous release ($PREV_VERSION) ---"
          # --no-deps needed here for the same reason as the install above.
          "$PY" -m pip install --no-index --find-links .release-smoke/prev --force-reinstall --no-deps sdd-cli
          INSTALLED=$("$PY" -m pip show sdd-cli | grep -i '^Version:' | awk '{print $2}')
          if [ "$INSTALLED" != "$PREV_VERSION" ]; then
            echo "ERROR: expected rolled-back version $PREV_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "OK: rollback succeeded ($INSTALLED)"

          echo "--- Re-upgrade to this release for the remaining smoke steps ---"
          "$PY" -m pip install --no-index --find-links dist --upgrade sdd-cli

      - name: Run CLI smoke commands
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          "$SDD_BIN" --help
          "$SDD_BIN" install --help
          "$SDD_BIN" wizard --list

      - name: Run standalone install smoke with packaged compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          mkdir -p .release-smoke/project
          cd .release-smoke/project
          "$OLDPWD/$SDD_BIN" install --wizard --non-interactive --only-template

      - name: Run native signing and verification smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          mkdir -p .release-smoke/sign-project
          cd .release-smoke/sign-project
          SDD="$OLDPWD/$SDD_BIN"
          "$SDD" install --wizard --non-interactive
          "$SDD" governance compile
          "$SDD" governance keygen --key-id ci-smoke-01
          "$SDD" governance sign --key-id ci-smoke-01
          "$SDD" --json governance audit | tee audit-report.json
          python3 - <<'PYEOF'
          import json

          with open("audit-report.json", encoding="utf-8") as fh:
              report = json.load(fh)

          data = report["data"]
          assert report["ok"] is True, report
          assert data["exit_code"] == 0, data
          assert data["metadata"]["verified_artifacts"] >= 2, data
          print("native signing/verification smoke: OK", data["metadata"])
          PYEOF

      - name: Verify compiler toolchain doctor report matches the tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          EXPECTED="${EXPECTED#V}"
          "$SDD_BIN" doctor compiler > doctor-report.json
          EXPECTED_VERSION="$EXPECTED" python3 - <<'PYEOF'
          import json
          import os

          with open("doctor-report.json", encoding="utf-8") as fh:
              report = json.load(fh)

          expected = os.environ["EXPECTED_VERSION"]
          binary = report["binary"]
          handshake = report["handshake"]
          # One assert chain proves ldflags injection, packaged-binary
          # resolution, and the CLI<->binary handshake end-to-end.
          assert binary["resolved"] is True, binary
          assert binary["version"].split()[-1] == expected, (binary, expected)
          assert handshake["status"] == "ok", handshake
          print("doctor toolchain smoke: OK", binary, handshake)
          PYEOF

  release-binary-install-smoke:
    name: Release Binary Install Smoke (${{ matrix.os }})
    needs: [validate, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            install.sh
            install.ps1
          sparse-checkout-cone-mode: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Serve dist/ locally
        # install.sh/install.ps1 always download from the real GitHub release,
        # which doesn't exist yet at smoke time (this job runs before the
        # `release` job creates it) — SDD_INSTALL_BASE_URL is the override
        # point both scripts expose for exactly this, same pattern as
        # CompilerRunner's own SDD_COMPILE_BIN override.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8934 --directory dist > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 20); do
            if curl -sSf "http://127.0.0.1:8934/SHA256SUMS" >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

      - name: Run install.sh
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDD_INSTALL_BASE_URL: "http://127.0.0.1:8934"
          SDD_INSTALL_DIR: ${{ runner.temp }}/sdd-install-smoke
        run: bash install.sh

      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDD_INSTALL_BASE_URL: "http://127.0.0.1:8934"
        run: |
          ./install.ps1 -InstallDir "${{ runner.temp }}\sdd-install-smoke"

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Run sdd --version from the installed binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN="${{ runner.temp }}/sdd-install-smoke/sdd.exe"
          else
            SDD_BIN="${{ runner.temp }}/sdd-install-smoke/sdd"
          fi
          "$SDD_BIN" --version

      - name: Verify the installed binary still resolves sdd-compile via CompilerRunner
        # Proves the "Do Not touch CompilerRunner" boundary held in practice —
        # design.md Execution Checklist item 5. No SDD_COMPILE_BIN override
        # here on purpose: this must go through CompilerRunner's normal
        # resolution chain, unmodified by this mission.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN="${{ runner.temp }}/sdd-install-smoke/sdd.exe"
          else
            SDD_BIN="${{ runner.temp }}/sdd-install-smoke/sdd"
          fi
          "$SDD_BIN" doctor compiler

  release-git-install-smoke:
    name: Release Git Install Smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Full checkout: install from this working copy. This lane exercises the
      # documented source-install channel end-to-end — including real checkout
      # semantics on Windows (core.symlinks=false), the failure class that shipped
      # undetected when only the wheelhouse channel was smoked. Avoid git+file://
      # here: uv's Windows parser treats drive-letter file URLs with resolved
      # git refs as ambiguous authority.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.9"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Point compiler at the built release binary (hermetic)
        shell: bash
        run: |
          set -euo pipefail
          # Release assets are not published yet at smoke time, so the runtime
          # download path cannot work here; pin the freshly built binary instead.
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="$(cygpath -m "$PWD/dist/sdd-compile-windows-amd64.exe")"
          else
            BIN="$PWD/dist/sdd-compile-linux-amd64"
            chmod +x "$BIN"
          fi
          echo "SDD_COMPILE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install sdd-cli from checkout source (documented client channel)
        shell: bash
        run: |
          set -euo pipefail
          # sdd-cli's local workspace dependencies (sdd-adapters, sdd-runtime,
          # etc.) aren't published to PyPI, so `uv tool install` needs each of
          # them handed in explicitly via --with — a bare `uv tool install
          # ./packages/interfaces/sdd_cli` fails with "sdd-adapters was not
          # found in the package registry".
          uv tool install ./packages/interfaces/sdd_cli \
            --with ./packages/core/sdd_core \
            --with ./packages/core/sdd_telemetry \
            --with ./packages/features/sdd_skills \
            --with ./packages/core/sdd_runtime \
            --with ./packages/features/sdd_adapters \
            --with ./packages/features/sdd_integration \
            --with ./packages/interfaces/sdd_wizard

      - name: Run client bootstrap from the source install
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # Must live outside $GITHUB_WORKSPACE: the sdd-harness checkout is
          # itself an SDD workspace (tracked .sdd/), so a scratch project
          # created inside it trips the nested-workspace guard in sdd's init command.
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_DIR="$(cygpath -m "$RUNNER_TEMP")/git-smoke-project"
          else
            SMOKE_DIR="$RUNNER_TEMP/git-smoke-project"
          fi
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          sdd install --wizard --non-interactive
          sdd init --default  # sdd-ci-policy: allow-client-smoke
          sdd governance validate  # sdd-ci-policy: allow-client-smoke

  release:
    name: Create GitHub Release
    needs: [release-install-smoke, release-git-install-smoke, release-binary-install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify release assets are staged
        shell: bash
        run: python3 -m tools.release.validate_release_assets dist

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          # Extract section between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "ERROR: missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          # Write to file to avoid quoting issues
          echo "$NOTES" > release_notes.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Sign artifacts with sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            dist/sdd-compile-linux-amd64
            dist/sdd-compile-linux-arm64
            dist/sdd-compile-darwin-amd64
            dist/sdd-compile-darwin-arm64
            dist/sdd-compile-windows-amd64.exe
            dist/*.whl
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          body_path: release_notes.txt
          files: |
            dist/*
            sbom.spdx.json
          tag_name: ${{ github.ref_name }}
          # If a release for this tag already exists (e.g. a manually created
          # release shell with no assets), update it in place and replace any
          # files with matching names rather than failing or duplicating.
          overwrite_files: true

      - name: Verify GitHub Release exposes standalone compiler assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          expected = {
              "sdd-compile-linux-amd64",
              "sdd-compile-linux-arm64",
              "sdd-compile-darwin-amd64",
              "sdd-compile-darwin-arm64",
              "sdd-compile-windows-amd64.exe",
              "SHA256SUMS",
          }
          tag = os.environ["GITHUB_REF_NAME"]
          url = (
              "https://api.github.com/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          found = {asset["name"] for asset in payload.get("assets", [])}
          missing = sorted(expected - found)
          if missing:
              print("ERROR: GitHub Release is missing assets:")
              for asset in missing:
                  print(f"  - {asset}")
              print("Found assets:")
              for asset in sorted(found):
                  print(f"  - {asset}")
              sys.exit(1)
          print("GitHub Release assets verified")
          PY

  provenance:
    name: Generate SLSA Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Generate build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          # Explicit glob (not a bare directory path) so coverage over every
          # dist/ artifact — compiler binaries and Python wheels alike — is
          # unambiguous rather than relying on this action's directory-handling
          # default (previously flagged as an open question, see
          # .analysis/refined/20260807-install-channel-supply-chain-fix/).
          subject-path: dist/*
