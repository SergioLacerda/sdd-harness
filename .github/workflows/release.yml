name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate semver tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '$TAG' does not match semver format vX.Y.Z or VX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uv venv \
              && uv sync --all-groups \
              && uv pip install -e packages/core/sdd_core \
              && uv pip install -e packages/core/sdd_telemetry \
              && uv pip install -e packages/features/sdd_integration \
              && uv pip install -e packages/interfaces/sdd_wizard \
              && uv pip install -e packages/interfaces/sdd_cli; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Build sdd-compile binary
        shell: bash
        run: make build-compiler

      - name: Run tests
        shell: bash
        run: uv run pytest tests/unit tests/integration -q --tb=short

      - name: Enforce golden snapshot policy (strict)
        shell: bash
        run: uv run python tools/ci/check_golden_policy.py --mode strict

      - name: Validate release readiness v1 checklist
        shell: bash
        run: uv run python tools/ci/check_release_readiness_v1.py

      - name: Verify version matches tag
        shell: bash
        run: |
          # The root package uses hatch-vcs; the release tag is the version authority.
          PKG_VERSION=$(uv run python tools/release/resolve_vcs_version.py)
          echo "Resolved version: $PKG_VERSION"
          echo "Tag version:     $VERSION"
          if [ "${PKG_VERSION%%+*}" != "$VERSION" ]; then
            echo "ERROR: resolved version ($PKG_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

  build:
    name: Build Distribution
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pip install uv build; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync sub-package versions to tag
        shell: bash
        run: python tools/release/sync_versions.py "${{ steps.version.outputs.tag }}"

      - name: Verify all package versions match tag
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Verifying all package versions = $VERSION"

          for pkg_dir in packages/core/* packages/features/* packages/interfaces/*; do
            if [ -f "$pkg_dir/pyproject.toml" ]; then
              PKG_VER=$(grep -E '^version\s*=' "$pkg_dir/pyproject.toml" | head -1 | sed 's/version\s*=\s*"\(.*\)"/\1/')
              if [ "$PKG_VER" != "$VERSION" ]; then
                echo "❌ ERROR: $pkg_dir version $PKG_VER != $VERSION"
                exit 1
              else
                echo "✓ $pkg_dir → $VERSION"
              fi
            fi
          done
          echo "✓ All package versions verified"

      - name: Build packages
        shell: bash
        run: |
          for pkg_dir in packages/core/* packages/features/* packages/interfaces/*; do
            if [ -f "$pkg_dir/pyproject.toml" ]; then
              echo "Building $pkg_dir"
              python -m build "$pkg_dir" --outdir dist/
            fi
          done

      - name: Install packages for compile step
        shell: bash
        run: |
          set -euo pipefail
          uv venv
          uv sync --all-groups
          uv pip install -e packages/core/sdd_core \
            && uv pip install -e packages/core/sdd_telemetry \
            && uv pip install -e packages/features/sdd_integration \
            && uv pip install -e packages/interfaces/sdd_wizard \
            && uv pip install -e packages/interfaces/sdd_cli

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Build sdd-compile binary
        shell: bash
        run: make build-compiler

      - name: Compile governance artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m sdd_cli compile
          cp generated/client/build/governance-core.json dist/governance-core.json
          cp generated/client/build/governance-client.json dist/governance-client.json
          cp generated/client/build/governance-core.json generated/client/build/final-template/.sdd/governance-core.json
          cp generated/client/build/governance-client.json generated/client/build/final-template/.sdd/governance-client.json

      - name: Cross-compile sdd-compile release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/sdd-compile-${goos}-${goarch}${ext}"
            echo "Building $out"
            GOOS="$goos" GOARCH="$goarch" go build -C tools/sdd-compile -o "$(pwd)/$out" .
          done
          (cd dist && sha256sum sdd-compile-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  release-install-smoke:
    name: Release Install Smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Create install smoke venv
        shell: bash
        run: python -m venv .release-smoke

      - name: Install sdd-cli from dist only (no PyPI fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --no-index --find-links dist sdd-cli

      - name: Run CLI smoke commands
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          "$SDD_BIN" --help
          "$SDD_BIN" install --help
          "$SDD_BIN" wizard --list

      - name: Run standalone install smoke with packaged compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
            export SDD_COMPILE_BIN="$PWD/dist/sdd-compile-windows-amd64.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
            export SDD_COMPILE_BIN="$PWD/dist/sdd-compile-linux-amd64"
            chmod +x "$SDD_COMPILE_BIN"
          fi
          mkdir -p .release-smoke/project
          cd .release-smoke/project
          "$OLDPWD/$SDD_BIN" install --wizard --non-interactive --only-template

  release:
    name: Create GitHub Release
    needs: release-install-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify release assets are staged
        shell: bash
        run: python3 tools/release/validate_release_assets.py dist

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          # Extract section between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "ERROR: missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          # Write to file to avoid quoting issues
          echo "$NOTES" > release_notes.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Sign artifacts with sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/sdd-compile-linux-amd64
            dist/sdd-compile-linux-arm64
            dist/sdd-compile-darwin-amd64
            dist/sdd-compile-darwin-arm64
            dist/sdd-compile-windows-amd64.exe
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: false
          body_path: release_notes.txt
          files: |
            dist/*
            sbom.spdx.json
          tag_name: ${{ github.ref_name }}
          # If a release for this tag already exists (e.g. a manually created
          # release shell with no assets), update it in place and replace any
          # files with matching names rather than failing or duplicating.
          overwrite_files: true

      - name: Verify GitHub Release exposes standalone compiler assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          expected = {
              "sdd-compile-linux-amd64",
              "sdd-compile-linux-arm64",
              "sdd-compile-darwin-amd64",
              "sdd-compile-darwin-arm64",
              "sdd-compile-windows-amd64.exe",
              "SHA256SUMS",
          }
          tag = os.environ["GITHUB_REF_NAME"]
          url = (
              "https://api.github.com/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          found = {asset["name"] for asset in payload.get("assets", [])}
          missing = sorted(expected - found)
          if missing:
              print("ERROR: GitHub Release is missing assets:")
              for asset in missing:
                  print(f"  - {asset}")
              print("Found assets:")
              for asset in sorted(found):
                  print(f"  - {asset}")
              sys.exit(1)
          print("GitHub Release assets verified")
          PY

  provenance:
    name: Generate SLSA Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Generate build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          subject-path: dist/
