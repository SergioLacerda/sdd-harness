name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse-tag.outputs.version }}
      tag: ${{ steps.parse-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate semver tag format
        id: parse-tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '$TAG' does not match semver format vX.Y.Z or VX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.9"

      - name: Install dependencies
        uses: ./.github/actions/uv-sync-retry
        with:
          create-venv: "true"
          retry-backoff-seconds: "15"
          editable-packages: |
            packages/core/sdd_core
            packages/core/sdd_telemetry
            packages/features/sdd_integration
            packages/features/sdd_pages
            packages/interfaces/sdd_wizard
            packages/interfaces/sdd_cli

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Build sdd-compile binary
        shell: bash
        run: make build-compiler

      - name: Run tests
        shell: bash
        run: uv run pytest tests/unit tests/integration -q --tb=short

      - name: Enforce golden snapshot policy (strict)
        shell: bash
        run: uv run python tools/ci/check_golden_policy.py --mode strict

      - name: Validate release readiness v1 checklist
        shell: bash
        run: uv run python tools/ci/check_release_readiness_v1.py

      - name: Verify version matches tag
        shell: bash
        run: |
          # The root package uses hatch-vcs; the release tag is the version authority.
          PKG_VERSION=$(uv run python -m tools.release.resolve_vcs_version)
          echo "Resolved version: $PKG_VERSION"
          echo "Tag version:     $VERSION"
          if [ "${PKG_VERSION%%+*}" != "$VERSION" ]; then
            echo "ERROR: resolved version ($PKG_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

  build:
    name: Build Distribution
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      artifact-name: dist

  release-install-smoke:
    name: Release Install Smoke (${{ matrix.os }})
    needs: [validate, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Create install smoke venv
        shell: bash
        run: python -m venv .release-smoke

      - name: Install sdd-cli from dist only (no PyPI fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --no-index --find-links dist sdd-cli

      - name: Upgrade/rollback smoke
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_NEW_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi

          # The tag this run is building for has no GitHub Release yet (the
          # `release` job that creates it runs after this one) — so "latest"
          # is guaranteed to be the previous published version, giving a real
          # N-1 artifact to upgrade from and roll back to, without hardcoding
          # a version number here.
          mkdir -p .release-smoke/prev
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.request

          url = (
              "https://api.github.com/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/releases/latest"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          wheel = next(
              (
                  asset
                  for asset in release["assets"]
                  if asset["name"].startswith("sdd_cli-") and asset["name"].endswith(".whl")
              ),
              None,
          )
          if wheel is None:
              raise SystemExit(
                  f"No sdd_cli-*.whl asset found on release {release['tag_name']}"
              )

          print(f"PREV_TAG={release['tag_name']}")
          print(f"PREV_WHEEL_NAME={wheel['name']}")
          print(f"PREV_WHEEL_URL={wheel['browser_download_url']}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PREV_TAG={release['tag_name']}\n")
              env_file.write(f"PREV_WHEEL_NAME={wheel['name']}\n")
              env_file.write(f"PREV_WHEEL_URL={wheel['browser_download_url']}\n")
          PYEOF

          echo "Downloading previous release wheel: $PREV_WHEEL_NAME ($PREV_TAG)"
          curl -sSL -o ".release-smoke/prev/$PREV_WHEEL_NAME" "$PREV_WHEEL_URL"

          PREV_VERSION="${PREV_TAG#v}"
          PREV_VERSION="${PREV_VERSION#V}"

          echo "--- Install previous release ($PREV_VERSION) ---"
          "$PY" -m pip install --no-index --find-links .release-smoke/prev sdd-cli
          INSTALLED=$("$PY" -m pip show sdd-cli | grep -i '^Version:' | awk '{print $2}')
          if [ "$INSTALLED" != "$PREV_VERSION" ]; then
            echo "ERROR: expected previous version $PREV_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "OK: previous version installed ($INSTALLED)"

          echo "--- Upgrade to this release ($EXPECTED_NEW_VERSION) ---"
          "$PY" -m pip install --no-index --find-links dist --upgrade sdd-cli
          INSTALLED=$("$PY" -m pip show sdd-cli | grep -i '^Version:' | awk '{print $2}')
          if [ "$INSTALLED" != "$EXPECTED_NEW_VERSION" ]; then
            echo "ERROR: expected upgraded version $EXPECTED_NEW_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "OK: upgrade succeeded ($INSTALLED)"

          echo "--- Roll back to previous release ($PREV_VERSION) ---"
          "$PY" -m pip install --no-index --find-links .release-smoke/prev --force-reinstall sdd-cli
          INSTALLED=$("$PY" -m pip show sdd-cli | grep -i '^Version:' | awk '{print $2}')
          if [ "$INSTALLED" != "$PREV_VERSION" ]; then
            echo "ERROR: expected rolled-back version $PREV_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "OK: rollback succeeded ($INSTALLED)"

          echo "--- Re-upgrade to this release for the remaining smoke steps ---"
          "$PY" -m pip install --no-index --find-links dist --upgrade sdd-cli

      - name: Run CLI smoke commands
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          "$SDD_BIN" --help
          "$SDD_BIN" install --help
          "$SDD_BIN" wizard --list

      - name: Run standalone install smoke with packaged compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          mkdir -p .release-smoke/project
          cd .release-smoke/project
          "$OLDPWD/$SDD_BIN" install --wizard --non-interactive --only-template

      - name: Run native signing and verification smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          mkdir -p .release-smoke/sign-project
          cd .release-smoke/sign-project
          SDD="$OLDPWD/$SDD_BIN"
          "$SDD" install --wizard --non-interactive
          "$SDD" governance compile
          "$SDD" governance keygen --key-id ci-smoke-01
          "$SDD" governance sign --key-id ci-smoke-01
          "$SDD" --json governance audit | tee audit-report.json
          python3 - <<'PYEOF'
          import json

          with open("audit-report.json", encoding="utf-8") as fh:
              report = json.load(fh)

          data = report["data"]
          assert report["ok"] is True, report
          assert data["exit_code"] == 0, data
          assert data["metadata"]["verified_artifacts"] >= 2, data
          print("native signing/verification smoke: OK", data["metadata"])
          PYEOF

      - name: Verify compiler toolchain doctor report matches the tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          EXPECTED="${EXPECTED#V}"
          "$SDD_BIN" doctor compiler > doctor-report.json
          EXPECTED_VERSION="$EXPECTED" python3 - <<'PYEOF'
          import json
          import os

          with open("doctor-report.json", encoding="utf-8") as fh:
              report = json.load(fh)

          expected = os.environ["EXPECTED_VERSION"]
          binary = report["binary"]
          handshake = report["handshake"]
          # One assert chain proves ldflags injection, packaged-binary
          # resolution, and the CLI<->binary handshake end-to-end.
          assert binary["resolved"] is True, binary
          assert binary["version"].split()[-1] == expected, (binary, expected)
          assert handshake["status"] == "ok", handshake
          print("doctor toolchain smoke: OK", binary, handshake)
          PYEOF

  release-git-install-smoke:
    name: Release Git Install Smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Full checkout: install from this working copy. This lane exercises the
      # documented source-install channel end-to-end — including real checkout
      # semantics on Windows (core.symlinks=false), the failure class that shipped
      # undetected when only the wheelhouse channel was smoked. Avoid git+file://
      # here: uv's Windows parser treats drive-letter file URLs with resolved
      # git refs as ambiguous authority.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.9"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Point compiler at the built release binary (hermetic)
        shell: bash
        run: |
          set -euo pipefail
          # Release assets are not published yet at smoke time, so the runtime
          # download path cannot work here; pin the freshly built binary instead.
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="$(cygpath -m "$PWD/dist/sdd-compile-windows-amd64.exe")"
          else
            BIN="$PWD/dist/sdd-compile-linux-amd64"
            chmod +x "$BIN"
          fi
          echo "SDD_COMPILE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install sdd-cli from checkout source (documented client channel)
        shell: bash
        run: |
          set -euo pipefail
          uv tool install ./packages/interfaces/sdd_cli

      - name: Run client bootstrap from the source install
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # Must live outside $GITHUB_WORKSPACE: the sdd-harness checkout is
          # itself an SDD workspace (tracked .sdd/), so a scratch project
          # created inside it trips the nested-workspace guard in sdd's init command.
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_DIR="$(cygpath -m "$RUNNER_TEMP")/git-smoke-project"
          else
            SMOKE_DIR="$RUNNER_TEMP/git-smoke-project"
          fi
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          sdd install --wizard --non-interactive
          sdd init --default  # sdd-ci-policy: allow-client-smoke
          sdd governance validate  # sdd-ci-policy: allow-client-smoke

  release:
    name: Create GitHub Release
    needs: [release-install-smoke, release-git-install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify release assets are staged
        shell: bash
        run: python3 -m tools.release.validate_release_assets dist

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          # Extract section between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "ERROR: missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          # Write to file to avoid quoting issues
          echo "$NOTES" > release_notes.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Sign artifacts with sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/sdd-compile-linux-amd64
            dist/sdd-compile-linux-arm64
            dist/sdd-compile-darwin-amd64
            dist/sdd-compile-darwin-arm64
            dist/sdd-compile-windows-amd64.exe
            dist/*.whl
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          body_path: release_notes.txt
          files: |
            dist/*
            sbom.spdx.json
          tag_name: ${{ github.ref_name }}
          # If a release for this tag already exists (e.g. a manually created
          # release shell with no assets), update it in place and replace any
          # files with matching names rather than failing or duplicating.
          overwrite_files: true

      - name: Verify GitHub Release exposes standalone compiler assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          expected = {
              "sdd-compile-linux-amd64",
              "sdd-compile-linux-arm64",
              "sdd-compile-darwin-amd64",
              "sdd-compile-darwin-arm64",
              "sdd-compile-windows-amd64.exe",
              "SHA256SUMS",
          }
          tag = os.environ["GITHUB_REF_NAME"]
          url = (
              "https://api.github.com/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          found = {asset["name"] for asset in payload.get("assets", [])}
          missing = sorted(expected - found)
          if missing:
              print("ERROR: GitHub Release is missing assets:")
              for asset in missing:
                  print(f"  - {asset}")
              print("Found assets:")
              for asset in sorted(found):
                  print(f"  - {asset}")
              sys.exit(1)
          print("GitHub Release assets verified")
          PY

  provenance:
    name: Generate SLSA Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Generate build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          # Explicit glob (not a bare directory path) so coverage over every
          # dist/ artifact — compiler binaries and Python wheels alike — is
          # unambiguous rather than relying on this action's directory-handling
          # default (previously flagged as an open question, see
          # .analysis/refined/20260807-install-channel-supply-chain-fix/).
          subject-path: dist/*

  # --------------------------------------------------------------------------
  # NOT YET ACTIVE — two manual preconditions outside this repo/CI must be
  # completed before this job can succeed:
  #
  #   1. Register `sdd-cli` as a project on pypi.org and configure a "trusted
  #      publisher" there for this exact repo + workflow file + job name
  #      (Settings > Publishing on the PyPI project page). This is a one-time
  #      manual step on PyPI's side — nothing in this repo can bootstrap it.
  #   2. `pypa/gh-action-pypi-publish` below is pinned to a moving tag
  #      (`release/v1`), not a commit SHA, unlike every other action in this
  #      file — this repo's own convention (confirmed across release.yml,
  #      reusable-*.yml) is to pin by SHA. Resolve the current release/v1 SHA
  #      and replace the line below before this job is trusted to run
  #      unattended; done as a tag reference here only because no network
  #      access was available to look up and verify the real SHA at the time
  #      this job was written.
  # --------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC trusted publishing — no PYPI_TOKEN secret needed
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Remove non-PyPI artifacts from the publish set
        shell: bash
        run: |
          set -euo pipefail
          # Only wheels are valid PyPI upload artifacts; dist/ also carries the
          # standalone compiler binaries, SHA256SUMS, SBOM, and compiled
          # governance JSON, none of which belong on PyPI.
          mkdir -p pypi-dist
          cp dist/*.whl pypi-dist/

      # SHA pin intentionally not resolved here — see the NOT YET ACTIVE note
      # above this job.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          skip-existing: true
