name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate semver tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '$TAG' does not match semver format vX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uv sync --all-groups \
              && uv pip install -e packages/core/sdd_core \
              && uv pip install -e packages/core/sdd_telemetry \
              && uv pip install -e packages/features/sdd_integration \
              && uv pip install -e packages/interfaces/sdd_wizard \
              && uv pip install -e packages/interfaces/sdd_cli; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Run tests
        shell: bash
        run: uv run pytest tests/unit tests/integration -q --tb=short

      - name: Enforce golden snapshot policy (strict)
        shell: bash
        run: uv run python tools/ci/check_golden_policy.py --mode strict

      - name: Validate release readiness v1 checklist
        shell: bash
        run: uv run python tools/ci/check_release_readiness_v1.py

      - name: Verify version matches tag
        shell: bash
        run: |
          # Generate _version.py from the current git tag via setuptools_scm
          uv run python -m setuptools_scm
          PKG_VERSION=$(uv run python -c "from _version import __version__; print(__version__)")
          echo "Package version: $PKG_VERSION"
          echo "Tag version:     $VERSION"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "ERROR: _version.py ($PKG_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

  build:
    name: Build Distribution
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pip install uv build; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync sub-package versions to tag
        shell: bash
        run: python tools/release/sync_versions.py "${{ steps.version.outputs.version }}"

      - name: Verify all package versions match tag
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Verifying all package versions = $VERSION"

          for pkg_dir in packages/core/* packages/features/* packages/interfaces/*; do
            if [ -f "$pkg_dir/pyproject.toml" ]; then
              PKG_VER=$(grep -E '^version\s*=' "$pkg_dir/pyproject.toml" | head -1 | sed 's/version\s*=\s*"\(.*\)"/\1/')
              if [ "$PKG_VER" != "$VERSION" ]; then
                echo "❌ ERROR: $pkg_dir version $PKG_VER != $VERSION"
                exit 1
              else
                echo "✓ $pkg_dir → $VERSION"
              fi
            fi
          done
          echo "✓ All package versions verified"

      - name: Build packages
        shell: bash
        run: |
          for pkg_dir in packages/core/* packages/features/* packages/interfaces/*; do
            if [ -f "$pkg_dir/pyproject.toml" ]; then
              echo "Building $pkg_dir"
              python -m build "$pkg_dir" --outdir dist/
            fi
          done

      - name: Install packages for compile step
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -e packages/core/sdd_core \
            && uv pip install -e packages/core/sdd_telemetry \
            && uv pip install -e packages/features/sdd_integration \
            && uv pip install -e packages/interfaces/sdd_wizard \
            && uv pip install -e packages/interfaces/sdd_cli

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Build sdd-compile binary
        shell: bash
        run: make build-compiler

      - name: Compile governance artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m sdd_cli compile
          cp generated/client/build/governance-core.json dist/governance-core.json
          cp generated/client/build/governance-client.json dist/governance-client.json
          cp generated/client/build/governance-core.json generated/client/build/final-template/.sdd/governance-core.json
          cp generated/client/build/governance-client.json generated/client/build/final-template/.sdd/governance-client.json

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  release-install-smoke:
    name: Release Install Smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Create install smoke venv
        shell: bash
        run: python -m venv .release-smoke

      - name: Install sdd-cli from dist only (no PyPI fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --no-index --find-links dist sdd-cli

      - name: Run CLI smoke commands
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          "$SDD_BIN" --help
          "$SDD_BIN" install --help
          "$SDD_BIN" wizard --list

  release:
    name: Create GitHub Release
    needs: release-install-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Extract section between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "ERROR: missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          # Write to file to avoid quoting issues
          echo "$NOTES" > release_notes.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Sign artifacts with cosign
        uses: sigstore/gh-action-release-sign@4c6f2d1f9d8a5c7e2b9a3f4e5d6c7b8a9f0e1d2c
        with:
          artifact-path: dist/
          token: ${{ secrets.GITHUB_TOKEN }}
          release-signing-secret: ${{ secrets.SIGSTORE_SIGNING_SECRET }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: false
          body_path: release_notes.txt
          files: |
            dist/*
            sbom.spdx.json
          tag_name: ${{ github.ref_name }}

  provenance:
    name: Generate SLSA Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Generate build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          subject-path: dist/
