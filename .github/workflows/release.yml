name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse-tag.outputs.version }}
      tag: ${{ steps.parse-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate semver tag format
        id: parse-tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '$TAG' does not match semver format vX.Y.Z or VX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uv venv \
              && uv sync --all-groups \
              && uv pip install -e packages/core/sdd_core \
              && uv pip install -e packages/core/sdd_telemetry \
              && uv pip install -e packages/features/sdd_integration \
              && uv pip install -e packages/interfaces/sdd_wizard \
              && uv pip install -e packages/interfaces/sdd_cli; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Build sdd-compile binary
        shell: bash
        run: make build-compiler

      - name: Run tests
        shell: bash
        run: uv run pytest tests/unit tests/integration -q --tb=short

      - name: Enforce golden snapshot policy (strict)
        shell: bash
        run: uv run python tools/ci/check_golden_policy.py --mode strict

      - name: Validate release readiness v1 checklist
        shell: bash
        run: uv run python tools/ci/check_release_readiness_v1.py

      - name: Verify version matches tag
        shell: bash
        run: |
          # The root package uses hatch-vcs; the release tag is the version authority.
          PKG_VERSION=$(uv run python -m tools.release.resolve_vcs_version)
          echo "Resolved version: $PKG_VERSION"
          echo "Tag version:     $VERSION"
          if [ "${PKG_VERSION%%+*}" != "$VERSION" ]; then
            echo "ERROR: resolved version ($PKG_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

  build:
    name: Build Distribution
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      artifact-name: dist

  release-install-smoke:
    name: Release Install Smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Create install smoke venv
        shell: bash
        run: python -m venv .release-smoke

      - name: Install sdd-cli from dist only (no PyPI fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --no-index --find-links dist sdd-cli

      - name: Run CLI smoke commands
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          "$SDD_BIN" --help
          "$SDD_BIN" install --help
          "$SDD_BIN" wizard --list

      - name: Run standalone install smoke with packaged compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          mkdir -p .release-smoke/project
          cd .release-smoke/project
          "$OLDPWD/$SDD_BIN" install --wizard --non-interactive --only-template

      - name: Run native signing and verification smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          mkdir -p .release-smoke/sign-project
          cd .release-smoke/sign-project
          SDD="$OLDPWD/$SDD_BIN"
          "$SDD" install --wizard --non-interactive
          "$SDD" governance compile
          "$SDD" governance keygen --key-id ci-smoke-01
          "$SDD" governance sign --key-id ci-smoke-01
          "$SDD" --json governance audit | tee audit-report.json
          python3 - <<'PYEOF'
          import json

          with open("audit-report.json", encoding="utf-8") as fh:
              report = json.load(fh)

          data = report["data"]
          assert report["ok"] is True, report
          assert data["exit_code"] == 0, data
          assert data["metadata"]["verified_artifacts"] >= 2, data
          print("native signing/verification smoke: OK", data["metadata"])
          PYEOF

      - name: Verify compiler toolchain doctor report matches the tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          EXPECTED="${EXPECTED#V}"
          "$SDD_BIN" doctor compiler > doctor-report.json
          EXPECTED_VERSION="$EXPECTED" python3 - <<'PYEOF'
          import json
          import os

          with open("doctor-report.json", encoding="utf-8") as fh:
              report = json.load(fh)

          expected = os.environ["EXPECTED_VERSION"]
          binary = report["binary"]
          handshake = report["handshake"]
          # One assert chain proves ldflags injection, packaged-binary
          # resolution, and the CLI<->binary handshake end-to-end.
          assert binary["resolved"] is True, binary
          assert binary["version"].split()[-1] == expected, (binary, expected)
          assert handshake["status"] == "ok", handshake
          print("doctor toolchain smoke: OK", binary, handshake)
          PYEOF

  release-git-install-smoke:
    name: Release Git Install Smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Full checkout: git+file:// installs clone from this working copy, so the
      # tag ref must exist locally. This lane exercises the documented client
      # channel (git subdirectory install) end-to-end — including real git
      # checkout semantics on Windows (core.symlinks=false), the failure class
      # that shipped undetected when only the wheelhouse channel was smoked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Point compiler at the built release binary (hermetic)
        shell: bash
        run: |
          set -euo pipefail
          # Release assets are not published yet at smoke time, so the runtime
          # download path cannot work here; pin the freshly built binary instead.
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="$(cygpath -m "$PWD/dist/sdd-compile-windows-amd64.exe")"
          else
            BIN="$PWD/dist/sdd-compile-linux-amd64"
            chmod +x "$BIN"
          fi
          echo "SDD_COMPILE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install sdd-cli via tag-pinned git (documented client channel)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            WS="$(cygpath -m "$GITHUB_WORKSPACE")"
          else
            WS="$GITHUB_WORKSPACE"
          fi
          uv tool install "git+file:///${WS#/}@${GITHUB_REF_NAME}#subdirectory=packages/interfaces/sdd_cli"

      - name: Run client bootstrap from the git install
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # Must live outside $GITHUB_WORKSPACE: the sdd-harness checkout is
          # itself an SDD workspace (tracked .sdd/), so a scratch project
          # created inside it trips the nested-workspace guard in sdd's init command.
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_DIR="$(cygpath -m "$RUNNER_TEMP")/git-smoke-project"
          else
            SMOKE_DIR="$RUNNER_TEMP/git-smoke-project"
          fi
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          sdd install --wizard --non-interactive
          sdd init --default  # sdd-ci-policy: allow-client-smoke
          sdd governance validate  # sdd-ci-policy: allow-client-smoke

  release:
    name: Create GitHub Release
    needs: [release-install-smoke, release-git-install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify release assets are staged
        shell: bash
        run: python3 -m tools.release.validate_release_assets dist

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          # Extract section between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "ERROR: missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          # Write to file to avoid quoting issues
          echo "$NOTES" > release_notes.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Sign artifacts with sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/sdd-compile-linux-amd64
            dist/sdd-compile-linux-arm64
            dist/sdd-compile-darwin-amd64
            dist/sdd-compile-darwin-arm64
            dist/sdd-compile-windows-amd64.exe
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          body_path: release_notes.txt
          files: |
            dist/*
            sbom.spdx.json
          tag_name: ${{ github.ref_name }}
          # If a release for this tag already exists (e.g. a manually created
          # release shell with no assets), update it in place and replace any
          # files with matching names rather than failing or duplicating.
          overwrite_files: true

      - name: Verify GitHub Release exposes standalone compiler assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          expected = {
              "sdd-compile-linux-amd64",
              "sdd-compile-linux-arm64",
              "sdd-compile-darwin-amd64",
              "sdd-compile-darwin-arm64",
              "sdd-compile-windows-amd64.exe",
              "SHA256SUMS",
          }
          tag = os.environ["GITHUB_REF_NAME"]
          url = (
              "https://api.github.com/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          found = {asset["name"] for asset in payload.get("assets", [])}
          missing = sorted(expected - found)
          if missing:
              print("ERROR: GitHub Release is missing assets:")
              for asset in missing:
                  print(f"  - {asset}")
              print("Found assets:")
              for asset in sorted(found):
                  print(f"  - {asset}")
              sys.exit(1)
          print("GitHub Release assets verified")
          PY

  provenance:
    name: Generate SLSA Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Generate build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          subject-path: dist/
