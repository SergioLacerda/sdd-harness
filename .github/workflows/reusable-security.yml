name: Reusable Security

on:
  workflow_call:

jobs:
  bootstrap-fingerprint-check:
    name: Bootstrap Fingerprint Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Compare AGENTS.md fingerprint against .sdd/metadata.json
        shell: bash
        run: |
          set -euo pipefail
          combined=$(python3 -c "import json; print(json.load(open('.sdd/metadata.json'))['fingerprints']['combined'])")
          agents_fp=$(grep -oP 'Governance fingerprint: \K[0-9a-f]+' AGENTS.md)
          if [[ "$combined" != "$agents_fp" ]]; then
            echo "AGENTS.md fingerprint ($agents_fp) does not match .sdd/metadata.json fingerprints.combined ($combined)."
            echo "Run 'uv run python -m sdd_cli governance generate' and sync AGENTS.md, then commit the update."
            exit 1
          fi

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v5
        with:
          version: "latest"
          cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Run Bandit
        run: uvx 'bandit[toml]' -r packages/ -c pyproject.toml -f txt

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v5
        with:
          version: "latest"
          cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Initialize UV workspace (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uv sync --all-groups; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Audit Dependencies
        run: |
          uv run --with pip-audit pip-audit --desc \
            --ignore-vuln PYSEC-2026-89
          # PYSEC-2026-89: markdown (transitive via mkdocs/mkdocs-material).
          # No fix available for 3.10.x series; markdown only renders internal
          # docs (not attacker-controlled input), so DoS risk is not applicable.

  npm-audit:
    name: npm Audit (apps/landing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/landing
        run: npm ci
      - name: Audit Dependencies
        working-directory: apps/landing
        run: npm audit --audit-level=high

  govulncheck:
    name: govulncheck (tools/sdd-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: tools/sdd-compile/go.mod
      - name: Run govulncheck
        working-directory: tools/sdd-compile
        shell: bash
        run: |
          set -o pipefail
          # GO-2026-4740 (github.com/shamaton/msgpack/v2): no fixed release
          # exists upstream yet. Mitigated in internal/govcompiler via
          # validateSerializable (depth/node-count limits before Marshal is
          # called) — see gov_compiler.go. Accepted-risk exception: fail the
          # build only if a *different* vulnerability is reported.
          output=$(go run golang.org/x/vuln/cmd/govulncheck@latest ./... 2>&1) || true
          echo "$output"
          other_vulns=$(echo "$output" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u | grep -v '^GO-2026-4740$' || true)
          if [[ -n "$other_vulns" ]]; then
            echo "Unaccepted vulnerabilities found: $other_vulns"
            exit 1
          fi
          if ! echo "$output" | grep -q 'GO-2026-4740'; then
            echo "GO-2026-4740 no longer reported — remove the accepted-risk exception in this step."
          fi

  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v5
        with:
          version: "latest"
          cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4  # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
      - name: Sync Docker ignore rules
        run: cp infrastructure/docker/.dockerignore .dockerignore
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            docker build -t sdd-framework:scan -f infrastructure/docker/Dockerfile . && break
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 15s..."
              sleep 15
            else
              exit 1
            fi
          done
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: sdd-framework:scan
          format: table
          severity: CRITICAL,HIGH
