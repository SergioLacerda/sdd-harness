name: Reusable Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bootstrap-fingerprint-check:
    name: Bootstrap Fingerprint Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Compare AGENTS.md fingerprint against .sdd/metadata.json
        shell: bash
        run: |
          set -euo pipefail
          combined=$(python3 -c "import json; print(json.load(open('.sdd/metadata.json'))['fingerprints']['combined'])")
          agents_fp=$(grep -oP 'Governance fingerprint: \K[0-9a-f]+' AGENTS.md)
          if [[ "$combined" != "$agents_fp" ]]; then
            echo "AGENTS.md fingerprint ($agents_fp) does not match .sdd/metadata.json fingerprints.combined ($combined)."
            echo "Run 'uv run python -m sdd_cli governance generate' and sync AGENTS.md, then commit the update."
            exit 1
          fi

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.9"
          enable-cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Run Bandit
        run: uvx 'bandit[toml]' -r packages/ -c pyproject.toml -f txt

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.9"
          enable-cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Initialize UV workspace (retry)
        uses: ./.github/actions/uv-sync-retry
      - name: Audit Dependencies
        run: |
          uv run --with pip-audit pip-audit --desc \
            --ignore-vuln PYSEC-2026-89
          # PYSEC-2026-89: markdown (transitive via mkdocs/mkdocs-material).
          # No fix available for 3.10.x series; markdown only renders internal
          # docs (not attacker-controlled input), so DoS risk is not applicable.

  npm-audit:
    name: npm Audit (apps/landing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: apps/landing
        run: npm ci
      - name: Audit Dependencies
        working-directory: apps/landing
        run: npm audit --audit-level=high

  govulncheck:
    name: govulncheck (tools/sdd-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: tools/sdd-compile/go.mod
      - name: Run govulncheck
        working-directory: tools/sdd-compile
        shell: bash
        run: |
          set -o pipefail
          # GO-2026-4740 (github.com/shamaton/msgpack/v2): accepted risk
          # reviewed on 2026-07-04; next review due 2026-08-04 or when
          # govulncheck stops reporting it. Mitigated in internal/govcompiler
          # via validateSerializable (depth/node-count limits before Marshal is
          # called) — see gov_compiler.go. Accepted-risk exception: fail the
          # build only if a *different* vulnerability is reported.
          #
          # Tool version pinned (not @latest — no floating tool versions in
          # PR/main builds per docs/adr ADR-009-ci-fail-closed-matrix and the
          # supply-chain policy). Freshness of the vulnerability data itself
          # does not depend on this pin: govulncheck always fetches the
          # current advisory database from https://vuln.go.dev at run time
          # regardless of the scanner binary's own version. Bump this tag
          # periodically to pick up scanner improvements — check newer tags
          # with `go list -m -versions golang.org/x/vuln`.
          output=$(go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./... 2>&1) || true
          echo "$output"
          other_vulns=$(echo "$output" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u | grep -v '^GO-2026-4740$' || true)
          if [[ -n "$other_vulns" ]]; then
            echo "Unaccepted vulnerabilities found: $other_vulns"
            exit 1
          fi
          if ! echo "$output" | grep -q 'GO-2026-4740'; then
            echo "GO-2026-4740 no longer reported — remove the accepted-risk exception in this step."
          fi

  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.9"
          enable-cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sync Docker ignore rules
        run: cp infrastructure/docker/.dockerignore .dockerignore
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            docker buildx build --load --no-cache --pull -t sdd-framework:scan -f infrastructure/docker/Dockerfile . && break
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 15s..."
              sleep 15
            else
              exit 1
            fi
          done
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: sdd-framework:scan
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Clean up staged .dockerignore
        if: always()
        run: rm -f .dockerignore
