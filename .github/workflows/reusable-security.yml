name: Reusable Security

on:
  workflow_call:

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v5
        with:
          version: "latest"
          cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Run Bandit
        run: uvx 'bandit[toml]' -r packages/ -c pyproject.toml -f txt

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v5
        with:
          version: "latest"
          cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Initialize UV workspace (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uv sync --all-groups; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Audit Dependencies
        run: |
          uv run --with pip-audit pip-audit --desc \
            --ignore-vuln PYSEC-2026-89
          # PYSEC-2026-89: markdown (transitive via mkdocs/mkdocs-material).
          # No fix available for 3.10.x series; markdown only renders internal
          # docs (not attacker-controlled input), so DoS risk is not applicable.

  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v5
        with:
          version: "latest"
          cache: true
      - name: Environment boundary preflight (security)
        shell: bash
        run: |
          uv run python tools/ci/environment_gates.py trusted-keyring-precedence-check --context security --mode warn
          uv run python tools/ci/environment_gates.py signature-mode-policy-check --context security --mode warn
      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
      - name: Sync Docker ignore rules
        run: cp infrastructure/docker/.dockerignore .dockerignore
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            docker build -t sdd-framework:scan -f infrastructure/docker/Dockerfile . && break
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 15s..."
              sleep 15
            else
              exit 1
            fi
          done
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: sdd-framework:scan
          format: table
          severity: CRITICAL,HIGH
