name: Reusable Release Build

# Shared build steps for release.yml (real release) and release-dry-run.yml
# (validation-only dry run). Both workflows need the exact same sequence:
# cross-compile the sdd-compile binaries, stage them into the sdd-core wheel,
# build every package, download the runtime wheelhouse, and compile
# governance artifacts. Keeping this in one place is what prevents a bug (or
# a future change) from having to be applied twice, in sync, in two
# near-identical files.
#
# Every workspace package resolves its own version directly from the tag via
# hatch-vcs (dynamic VCS versioning) — there is no separate version-sync step;
# the "Verify built wheels match the tag version" step below is what confirms
# every package actually resolved the right version.

on:
  workflow_call:
    inputs:
      version:
        description: "Plain semver version (no leading v/V), e.g. 1.2.3"
        required: true
        type: string
      tag:
        description: "Git tag as written, e.g. v1.2.3 or V1.2.3"
        required: true
        type: string
      artifact-name:
        description: "Name for the uploaded dist/ artifact"
        required: false
        type: string
        default: "dist"
      verify-exact-version:
        description: >-
          Whether to fail the build if a package's wheel filename doesn't
          exactly match `version`. Only meaningful when `tag` is a Git tag
          that already exists at checkout time (the real release.yml build,
          triggered by an actual tag push) — hatch-vcs then resolves that
          exact tag. release-dry-run.yml runs *before* any such tag exists
          (either validating a candidate tag that hasn't been created yet, or
          on a plain push to main with no tag at all), so hatch-vcs always
          resolves the real git-describe dev version instead — the exact
          match would always fail there for reasons unrelated to build
          correctness. Dry runs should pass `false`.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pip install uv build; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Verify all packages use dynamic (VCS) versioning
        shell: bash
        run: |
          echo "Verifying every workspace package resolves its version via hatch-vcs"
          for pkg_dir in packages/core/* packages/features/* packages/interfaces/*; do
            if [ -f "$pkg_dir/pyproject.toml" ]; then
              if ! grep -q '^dynamic = \[.*"version".*\]' "$pkg_dir/pyproject.toml"; then
                echo "❌ ERROR: $pkg_dir does not use dynamic (VCS) versioning"
                exit 1
              fi
              echo "✓ $pkg_dir uses dynamic (VCS) versioning"
            fi
          done

      - name: Cross-compile sdd-compile release binaries
        shell: bash
        run: |
          set -euo pipefail
          make build-compiler
          mkdir -p dist
          # Inject the release version so the CLI<->binary version handshake can
          # detect skew at runtime (local builds report "dev" and skip the check).
          VERSION="${{ inputs.version }}"
          LDFLAGS="-X sdd-compile/cmd.version=${VERSION}"
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/sdd-compile-${goos}-${goarch}${ext}"
            echo "Building $out"
            GOOS="$goos" GOARCH="$goarch" go build -C tools/sdd-compile -ldflags "$LDFLAGS" -o "$(pwd)/$out" .
          done

      - name: Stage packaged compiler assets for sdd-core wheel
        shell: bash
        run: python -m tools.release.stage_packaged_compiler_assets dist

      - name: Build packages
        shell: bash
        run: |
          for pkg_dir in packages/core/* packages/features/* packages/interfaces/*; do
            if [ -f "$pkg_dir/pyproject.toml" ]; then
              echo "Building $pkg_dir"
              # --wheel only: no sdist is published or consumed anywhere in
              # this pipeline — only wheels are installed (see
              # release-install-smoke).
              python -m build --wheel "$pkg_dir" --outdir dist/
            fi
          done

      - name: Generate SHA256SUMS (compiler binaries + wheels)
        shell: bash
        run: |
          # Generated after both the compiler-binary build and the wheel build so
          # a single SHA256SUMS covers everything installers actually consume —
          # previously this ran before wheels existed and silently excluded them.
          (cd dist && sha256sum sdd-compile-* *.whl > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Verify sdd-core wheel bundles native compiler binaries
        shell: bash
        run: python -m tools.release.verify_wheel_native_assets dist

      - name: Verify internal wheel dependencies are version-coupled
        shell: bash
        run: python -m tools.release.verify_wheel_dependency_coupling dist

      - name: Verify built wheels match the tag version
        if: ${{ inputs.verify-exact-version }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          for pkg_dir in packages/core/* packages/features/* packages/interfaces/*; do
            [ -f "$pkg_dir/pyproject.toml" ] || continue
            pkg_name=$(grep -E '^name = ' "$pkg_dir/pyproject.toml" | head -1 | sed 's/name = "\(.*\)"/\1/' | tr '-' '_')
            if ! ls dist/"$pkg_name"-"$VERSION"-*.whl >/dev/null 2>&1; then
              echo "❌ ERROR: built $pkg_name wheel does not match tag version $VERSION"
              ls dist/"$pkg_name"-*.whl || true
              exit 1
            fi
            echo "✓ $pkg_name wheel matches tag version $VERSION"
          done

      - name: Download runtime dependency wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download \
            --dest dist \
            --find-links dist \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 312 \
            --abi cp312 \
            dist/sdd_cli-*.whl
          python -m pip download \
            --dest dist \
            --find-links dist \
            --only-binary=:all: \
            --platform win_amd64 \
            --implementation cp \
            --python-version 312 \
            --abi cp312 \
            dist/sdd_cli-*.whl
          python -m pip download \
            --dest dist \
            --find-links dist \
            --only-binary=:all: \
            --platform macosx_11_0_arm64 \
            --implementation cp \
            --python-version 312 \
            --abi cp312 \
            dist/sdd_cli-*.whl
          python -m pip download \
            --dest dist \
            --only-binary=:all: \
            "colorama>=0.4.6"

      - name: Install packages for compile step
        shell: bash
        run: |
          set -euo pipefail
          # --clear: `make build-compiler` above resolves $(PYTHON) to `uv run
          # python` when no .venv exists yet, and `uv run` implicitly creates
          # one — so .venv may already exist by the time we get here.
          uv venv --clear
          uv sync --all-groups
          uv pip install -e packages/core/sdd_core \
            && uv pip install -e packages/core/sdd_telemetry \
            && uv pip install -e packages/features/sdd_skills \
            && uv pip install -e packages/core/sdd_runtime \
            && uv pip install -e packages/features/sdd_adapters \
            && uv pip install -e packages/features/sdd_integration \
            && uv pip install -e packages/features/sdd_pages \
            && uv pip install -e packages/interfaces/sdd_wizard \
            && uv pip install -e packages/interfaces/sdd_cli

      - name: Compile governance artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m sdd_cli governance compile --profile client
          cp generated/client/build/governance-core.json dist/governance-core.json
          cp generated/client/build/governance-client.json dist/governance-client.json
          mkdir -p generated/client/build/final-template/.sdd
          cp generated/client/build/governance-core.json generated/client/build/final-template/.sdd/governance-core.json
          cp generated/client/build/governance-client.json generated/client/build/final-template/.sdd/governance-client.json

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Intermediate name: merge-release-assets (below) downloads this
          # plus the per-OS sdd CLI binaries, regenerates SHA256SUMS over the
          # combined set, and re-uploads under inputs.artifact-name — the
          # name every downstream job (release.yml, release-dry-run.yml)
          # actually consumes. Kept distinct so this job's own upload can
          # never race the merge job's upload of the same name.
          name: ${{ inputs.artifact-name }}-base
          path: dist/

  build-cli-binaries:
    name: Build sdd CLI binary (${{ matrix.os }})
    # Independent of `build` — installs the workspace packages directly from
    # source on each native runner (PyInstaller cannot cross-compile the way
    # `go build` can, so unlike the sdd-compile matrix above, this genuinely
    # needs one runner per target OS). Wheels built here are thrown away after
    # the binary is produced; `build`'s own wheels (the ones actually
    # published) are untouched.
    #
    # Coverage gap, accepted (see .analysis/refined/20260807-cli-binary-installer-followup/proposal.md
    # § 1): GitHub-hosted `macos-latest` is Apple Silicon (arm64) only, so this
    # matrix produces linux-amd64, darwin-arm64, and windows-amd64 — not the
    # 5-target parity the sdd-compile Go matrix has (notably no darwin-amd64).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: sdd-linux-amd64
          - os: macos-latest
            asset_name: sdd-darwin-arm64
          - os: windows-latest
            asset_name: sdd-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build pyinstaller

      - name: Build and install workspace packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cli-dist
          for pkg_dir in packages/core/sdd_core packages/core/sdd_runtime packages/core/sdd_telemetry packages/features/sdd_adapters packages/features/sdd_integration packages/features/sdd_pages packages/features/sdd_skills packages/interfaces/sdd_wizard packages/interfaces/sdd_cli; do
            python -m build --wheel "$pkg_dir" --outdir cli-dist
          done
          python -m pip install --find-links cli-dist sdd-cli

      - name: Build standalone sdd binary with PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          # --collect-submodules is required for sdd_cli (lazy command loading
          # via importlib.import_module in _command_group.py) and sdd_wizard
          # (same pattern in contracts.py / _phase_runtime_core.py) — neither
          # is visible to PyInstaller's static import analysis. The rest are
          # included defensively for the same reason. --copy-metadata sdd-cli
          # is required separately: CompilerRunner._installed_cli_version()
          # calls importlib.metadata.version("sdd-cli"), which raises
          # PackageNotFoundError inside a frozen binary unless the wheel's
          # dist-info is explicitly bundled — confirmed by a local build
          # during this task; omitting this flag breaks `sdd doctor compiler`
          # silently (no build-time error, only a runtime resolution failure).
          ENTRYPOINT=$(python3 -c "import sdd_cli.main as m; print(m.__file__)")
          pyinstaller --onefile --name sdd \
            --collect-submodules sdd_cli \
            --collect-submodules sdd_wizard \
            --collect-submodules sdd_core \
            --collect-submodules sdd_integration \
            --collect-submodules sdd_pages \
            --collect-submodules sdd_skills \
            --collect-submodules sdd_adapters \
            --collect-submodules sdd_runtime \
            --collect-submodules sdd_telemetry \
            --copy-metadata sdd-cli \
            "$ENTRYPOINT"

      - name: Stage and smoke-test the built binary
        shell: bash
        run: |
          set -euo pipefail
          # PyInstaller writes ./dist/sdd(.exe) — same relative dist/ this
          # step also stages the renamed asset into, so rename in place
          # before staging rather than copying dist onto itself.
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/sdd.exe "dist/${{ matrix.asset_name }}"
          else
            mv dist/sdd "dist/${{ matrix.asset_name }}"
            chmod +x "dist/${{ matrix.asset_name }}"
          fi
          "./dist/${{ matrix.asset_name }}" --help
          "./dist/${{ matrix.asset_name }}" version
          "./dist/${{ matrix.asset_name }}" wizard --list

      - name: Upload CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cli-binary-${{ matrix.os }}
          path: dist/${{ matrix.asset_name }}

  merge-release-assets:
    name: Merge release assets and regenerate SHA256SUMS
    needs: [build, build-cli-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Download compiler/wheel assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ inputs.artifact-name }}-base
          path: dist/

      - name: Download sdd CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: cli-binary-*
          path: dist/
          merge-multiple: true

      - name: Regenerate SHA256SUMS over the combined asset set
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum sdd-compile-* sdd-linux-* sdd-darwin-* sdd-windows-* *.whl > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload merged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
