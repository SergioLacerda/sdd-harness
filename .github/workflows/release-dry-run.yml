name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer tag to validate (example: v1.2.3 or V1.2.3)"
        required: true
        type: string
  push:
    branches: [main]

concurrency:
  group: release-dry-run-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Validate & Build Dry Run
    runs-on: ubuntu-latest
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse-tag.outputs.version || steps.parse-tag-push.outputs.version }}
      tag: ${{ steps.parse-tag.outputs.tag || steps.parse-tag-push.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version for automatic (push) trigger
        id: parse-tag-push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # On a plain push to main (no tag yet), there is no release version
          # to validate against the changelog — this run only needs to prove
          # the shared build steps still succeed, so use a synthetic
          # placeholder version/tag for the reusable build workflow's inputs.
          echo "TAG=v0.0.0" >> "$GITHUB_ENV"
          echo "VERSION=0.0.0" >> "$GITHUB_ENV"
          echo "tag=v0.0.0" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0" >> "$GITHUB_OUTPUT"

      - name: Validate semver tag format
        id: parse-tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$TAG" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '$TAG' does not match semver format vX.Y.Z or VX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate changelog entry exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "ERROR: missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          echo "Changelog section found for $VERSION"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.9"

      - name: Install dependencies
        uses: ./.github/actions/uv-sync-retry
        with:
          create-venv: "true"
          retry-backoff-seconds: "15"
          editable-packages: |
            packages/core/sdd_core
            packages/core/sdd_telemetry
            packages/features/sdd_integration
            packages/features/sdd_pages
            packages/interfaces/sdd_wizard
            packages/interfaces/sdd_cli

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Build sdd-compile binary
        shell: bash
        run: make build-compiler

      - name: Run release-critical tests
        shell: bash
        run: uv run pytest tests/unit tests/integration -q --tb=short

      - name: Enforce golden snapshot policy (strict)
        shell: bash
        run: uv run python tools/ci/check_golden_policy.py --mode strict

      - name: Validate release readiness v1 checklist
        shell: bash
        run: uv run python tools/ci/check_release_readiness_v1.py

  dry-run-build:
    name: Build Distribution (Dry Run)
    needs: dry-run
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      version: ${{ needs.dry-run.outputs.version }}
      tag: ${{ needs.dry-run.outputs.tag }}
      artifact-name: release-dry-run-dist
      # Neither trigger path (workflow_dispatch with a candidate tag, or an
      # automatic push to main) has a real Git tag at checkout time yet, so
      # hatch-vcs can never resolve exactly `version` here — see the input's
      # description in reusable-release-build.yml.
      verify-exact-version: false

  release-install-smoke:
    name: Release Install Smoke (${{ matrix.os }})
    needs: dry-run-build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dry-run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: release-dry-run-dist
          path: dist/

      - name: Create install smoke venv
        shell: bash
        run: python -m venv .release-smoke

      - name: Install sdd-cli from dist only (no PyPI fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --no-index --find-links dist sdd-cli

      - name: Run CLI smoke commands
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          "$SDD_BIN" --help
          "$SDD_BIN" install --help
          "$SDD_BIN" wizard --list

      - name: Run standalone install smoke with packaged compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          mkdir -p .release-smoke/project
          cd .release-smoke/project
          "$OLDPWD/$SDD_BIN" install --wizard --non-interactive --only-template

  release-git-install-smoke:
    name: Release Git Install Smoke (${{ matrix.os }})
    needs: dry-run-build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Mirrors release.yml's git-install smoke: exercises the documented client
      # channel (git subdirectory install) with real git checkout semantics on
      # Windows, pinned to the pushed commit instead of a tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.9"

      - name: Download dry-run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: release-dry-run-dist
          path: dist/

      - name: Point compiler at the built release binary (hermetic)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="$(cygpath -m "$PWD/dist/sdd-compile-windows-amd64.exe")"
          else
            BIN="$PWD/dist/sdd-compile-linux-amd64"
            chmod +x "$BIN"
          fi
          echo "SDD_COMPILE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install sdd-cli via commit-pinned git (documented client channel)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            WS="$(cygpath -m "$GITHUB_WORKSPACE")"
          else
            WS="$GITHUB_WORKSPACE"
          fi
          uv tool install "git+file:///${WS#/}#subdirectory=packages/interfaces/sdd_cli"

      - name: Run client bootstrap from the git install
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # Must live outside $GITHUB_WORKSPACE: the sdd-harness checkout is
          # itself an SDD workspace (tracked .sdd/), so a scratch project
          # created inside it trips the nested-workspace guard in sdd's init command.
          if [ "${{ runner.os }}" = "Windows" ]; then
            SMOKE_DIR="$(cygpath -m "$RUNNER_TEMP")/git-smoke-project"
          else
            SMOKE_DIR="$RUNNER_TEMP/git-smoke-project"
          fi
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          sdd install --wizard --non-interactive
          sdd init --default  # sdd-ci-policy: allow-client-smoke
          sdd governance validate  # sdd-ci-policy: allow-client-smoke
