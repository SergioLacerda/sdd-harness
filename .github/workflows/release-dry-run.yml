name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer tag to validate (example: v1.2.3 or V1.2.3)"
        required: true
        type: string

concurrency:
  group: release-dry-run-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    name: Validate & Build Dry Run
    runs-on: ubuntu-latest
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate semver tag format
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$TAG" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '$TAG' does not match semver format vX.Y.Z or VX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate changelog entry exists
        shell: bash
        run: |
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "ERROR: missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi
          echo "Changelog section found for $VERSION"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "latest"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uv venv \
              && uv sync --all-groups \
              && uv pip install -e packages/core/sdd_core \
              && uv pip install -e packages/core/sdd_telemetry \
              && uv pip install -e packages/features/sdd_integration \
              && uv pip install -e packages/interfaces/sdd_wizard \
              && uv pip install -e packages/interfaces/sdd_cli; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: tools/sdd-compile/go.sum

      - name: Build sdd-compile binary
        shell: bash
        run: make build-compiler

      - name: Run release-critical tests
        shell: bash
        run: uv run pytest tests/unit tests/integration -q --tb=short

      - name: Enforce golden snapshot policy (strict)
        shell: bash
        run: uv run python tools/ci/check_golden_policy.py --mode strict

      - name: Validate release readiness v1 checklist
        shell: bash
        run: uv run python tools/ci/check_release_readiness_v1.py

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pip install build; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Sync sub-package versions (dry run)
        shell: bash
        run: python tools/release/sync_versions.py "$TAG"

      - name: Build packages (dry run)
        shell: bash
        run: |
          mkdir -p dist
          for pkg_dir in packages/core/* packages/features/* packages/interfaces/*; do
            if [ -f "$pkg_dir/pyproject.toml" ]; then
              echo "Building $pkg_dir"
              python -m build "$pkg_dir" --outdir dist/
            fi
          done

      - name: Compile governance artifacts (dry run)
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m sdd_cli governance compile
          cp generated/client/build/governance-core.json dist/governance-core.json
          cp generated/client/build/governance-client.json dist/governance-client.json
          cp generated/client/build/governance-core.json generated/client/build/final-template/.sdd/governance-core.json
          cp generated/client/build/governance-client.json generated/client/build/final-template/.sdd/governance-client.json

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dry-run-dist
          path: dist/

  release-install-smoke:
    name: Release Install Smoke (${{ matrix.os }})
    needs: dry-run
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dry-run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: release-dry-run-dist
          path: dist/

      - name: Create install smoke venv
        shell: bash
        run: python -m venv .release-smoke

      - name: Install sdd-cli from dist only (no PyPI fallback)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY=".release-smoke/Scripts/python.exe"
          else
            PY=".release-smoke/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --no-index --find-links dist sdd-cli

      - name: Run CLI smoke commands
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            SDD_BIN=".release-smoke/Scripts/sdd.exe"
          else
            SDD_BIN=".release-smoke/bin/sdd"
          fi
          "$SDD_BIN" --help
          "$SDD_BIN" install --help
          "$SDD_BIN" wizard --list
