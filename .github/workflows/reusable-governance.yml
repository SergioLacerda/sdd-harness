name: Reusable Governance

on:
  workflow_call:

jobs:
  compliance:
    name: Governance Compliance (P003)
    runs-on: ubuntu-latest
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v5

      - name: Bootstrap SDD CLI
        uses: ./.github/actions/bootstrap-sdd-cli

      - name: Validate Human Review (P003)
        run: |
          echo "Verifying Ed25519 signatures for governance sources..."
          uv run python tools/governance/compliance.py . --verify

      - name: Compile governance artifacts
        run: |
          uv run python -m sdd_cli governance compile

      - name: Security Audit (informational)
        # Non-blocking: signature validation requires the private key to re-sign
        # artifacts after compile. Key is not available in CI.
        # Use: uv run python -m sdd_cli governance audit  (local, after signing)
        continue-on-error: true
        run: |
          uv run python -m sdd_cli governance audit
