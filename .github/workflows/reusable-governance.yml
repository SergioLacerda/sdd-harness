name: Reusable Governance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compliance:
    name: Governance Compliance (P003)
    runs-on: ubuntu-latest
    env:
      SDD_ENFORCE_PIPELINE_CORRECT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - name: Bootstrap SDD CLI
        uses: ./.github/actions/bootstrap-sdd-cli

      - name: Validate Human Review (P003)
        run: |
          echo "Verifying Ed25519 signatures for governance sources..."
          uv run python tools/governance/compliance.py . --verify

      - name: Compile governance artifacts
        run: |
          uv run python -m sdd_cli governance compile

      - name: Security Audit (ephemeral CI key)
        # Blocking: signs the artifacts compiled above with a job-local ephemeral
        # Ed25519 key (discarded when the runner terminates — never the
        # production signing key), then audits against that signature. Same
        # keygen -> sign -> audit sequence release.yml's own signing smoke test
        # already proves works (release.yml:184-212).
        #
        # `sdd governance audit` WITHOUT --json returns the correct process
        # exit code (0/1) on pass/fail — verified locally. --json mode always
        # exits 0 and only encodes pass/fail in the JSON payload (that's why
        # release.yml's own smoke test greps the JSON with a Python assertion
        # instead of trusting the shell exit code); using plain-text mode here
        # avoids needing that extra step.
        run: |
          set -euo pipefail
          uv run python -m sdd_cli governance keygen --key-id ci-governance-audit
          uv run python -m sdd_cli governance sign --key-id ci-governance-audit
          uv run python -m sdd_cli governance audit
