name: Documentation Quality & Publish

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'tools/verify_mkdocs_paths.py'
      - 'tools/docs/check_links.py'
      - 'tools/docs/check_runtime_path_schema.py'
      - '.markdownlint-cli2.jsonc'
      - 'packages/interfaces/sdd_cli/src/sdd_cli/commands/docs.py'
      - '.github/workflows/docs.yml'
      - '.sdd/metadata.json'
      - '.sdd/source/mandates/mandates.md'
      - '.sdd/source/guidelines.dsl'
      - 'packages/interfaces/sdd_wizard/src/sdd_wizard/orchestration/wizard/selector_compiler.py'
      - 'packages/interfaces/sdd_wizard/src/sdd_wizard/templates/selector/**'
      - 'packages/features/sdd_pages/**'
      - 'apps/landing/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'tools/verify_mkdocs_paths.py'
      - 'tools/docs/check_links.py'
      - 'tools/docs/check_runtime_path_schema.py'
      - '.markdownlint-cli2.jsonc'
      - 'packages/interfaces/sdd_cli/src/sdd_cli/commands/docs.py'
      - '.github/workflows/docs.yml'
      - '.sdd/metadata.json'
      - '.sdd/source/mandates/mandates.md'
      - '.sdd/source/guidelines.dsl'
      - 'packages/interfaces/sdd_wizard/src/sdd_wizard/orchestration/wizard/selector_compiler.py'
      - 'packages/interfaces/sdd_wizard/src/sdd_wizard/templates/selector/**'
      - 'packages/features/sdd_pages/**'
      - 'apps/landing/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          version: "latest"

      - name: Install all dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if make install; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Enforce CI command policy
        run: uv run python tools/ci/check_no_sdd_ci_commands.py

      - name: Verify CLI module
        run: uv run python -m sdd_cli --help > /dev/null

      - name: Validate MkDocs mapped paths
        run: uv run python tools/verify_mkdocs_paths.py

      - name: Validate active docs anchors
        run: uv run python -m sdd_cli lint spec --validate-all-anchors --strict-anchor-style

      - name: Validate PATH IA-first runtime schema
        run: uv run python tools/docs/check_runtime_path_schema.py

      - name: Check internal docs links (advisory baseline)
        continue-on-error: true
        run: uv run python tools/docs/check_links.py --mode ci

      - name: Check internal docs links (PR diff-aware blocking)
        if: github.event_name == 'pull_request'
        run: |
          uv run python tools/docs/check_links.py \
            --mode ci \
            --changed-files-from-git \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Markdown style advisory (non-blocking)
        continue-on-error: true
        run: npx --yes markdownlint-cli2 "docs/**/*.md"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/landing/package-lock.json

      - name: Install landing app dependencies
        working-directory: apps/landing
        run: npm ci

      - name: Lint landing app
        working-directory: apps/landing
        run: npm run lint

      - name: Test landing app
        working-directory: apps/landing
        run: npm run cover

      - name: Build site (make docs-build)
        run: make docs-build

      - name: Generate docs index
        run: |
          uv run python -c "
          from pathlib import Path
          from sdd_pages.selector import DocumentIndexer
          indexer = DocumentIndexer()
          entries = indexer.index(Path('docs'))
          indexer.to_json(entries, Path('build/site/selector/docs.index.json'))
          print(f'Indexed {len(entries)} documents')
          "

      - name: Validate docs index
        run: |
          uv run python -c "
          from pathlib import Path
          from sdd_pages.validator import IndexValidator
          result = IndexValidator().validate(Path('build/site/selector/docs.index.json'), source_dir=Path('docs'))
          for w in result.warnings: print('WARNING:', w)
          if not result.valid:
              for e in result.errors: print('ERROR:', e)
              raise SystemExit(1)
          print('Docs index valid')
          "

      - name: Compress site assets
        run: |
          uv run python -c "
          from pathlib import Path
          from sdd_pages.compression import CompressionEngine
          engine = CompressionEngine()
          site_dir = Path('build/site')
          results = []
          for file_path in sorted(site_dir.rglob('*')):
              if not file_path.is_file() or file_path.suffix not in ('.html', '.css', '.js', '.json', '.svg'):
                  continue
              result = engine.compress_gzip(file_path)
              if result is not None:
                  results.append(result)
          manifest_dir = site_dir / '.compressed'
          manifest_dir.mkdir(parents=True, exist_ok=True)
          engine.generate_manifest(results, manifest_dir / 'manifest.json')
          print(f'Compressed {len(results)} files')
          "

      - name: Assert compression ratios meet minimum threshold
        run: |
          uv run python -c "
          import json, sys
          from pathlib import Path
          manifest_path = Path('build/site/.compressed/manifest.json')
          if not manifest_path.exists():
              print('No compression manifest found — skipping gate')
              sys.exit(0)
          entries = json.loads(manifest_path.read_text())['entries']
          # Fail if any compressible file achieves less than 5% savings (ratio < 0.05).
          # Files this close to uncompressed are likely already binary-compressed or tiny;
          # raise the threshold here if too many legitimate files are flagged.
          poor = [e for e in entries if e['ratio'] < 0.05]
          if poor:
              for e in poor:
                  print(f'WARN: low compression ratio {e[\"ratio\"]:.2%} for {e[\"source\"]}')
          total_original = sum(e['original_size'] for e in entries)
          total_compressed = sum(e['compressed_size'] for e in entries)
          overall = 1 - total_compressed / total_original if total_original else 0
          print(f'Overall compression: {overall:.1%} ({total_original} → {total_compressed} bytes, {len(entries)} files)')
          # Hard gate: overall ratio must be at least 1% (catches broken compression).
          if overall < 0.01 and entries:
              print('ERROR: overall compression ratio below 1% — compression may be broken')
              sys.exit(1)
          "

      - name: Upload compression manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compression-manifest
          path: build/site/.compressed/manifest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Copy _headers template (Netlify/Cloudflare Pages only)
        # GitHub Pages ignores _headers; this step is a no-op for gh-pages deployments.
        # The file documents cache-control and content-encoding policies for alternative
        # hosting targets. Copy unconditionally so the artifact is always present.
        run: |
          uv run python -c "
          import shutil
          from importlib import resources
          src = resources.files('sdd_pages').joinpath('templates').joinpath('_headers')
          shutil.copy(str(src), 'build/site/_headers')
          print('_headers written to build/site/_headers')
          "

      - name: Set up Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
        with:
          enablement: false

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
