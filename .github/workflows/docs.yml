name: Documentation Quality & Publish

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'tools/verify_mkdocs_paths.py'
      - 'tools/docs/check_links.py'
      - 'tools/docs/check_runtime_path_schema.py'
      - '.markdownlint-cli2.jsonc'
      - 'packages/interfaces/sdd_cli/src/sdd_cli/commands/docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'tools/verify_mkdocs_paths.py'
      - 'tools/docs/check_links.py'
      - 'tools/docs/check_runtime_path_schema.py'
      - '.markdownlint-cli2.jsonc'
      - 'packages/interfaces/sdd_cli/src/sdd_cli/commands/docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "latest"

      - name: Install all dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if make install; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Enforce CI command policy
        run: uv run python tools/ci/check_no_sdd_ci_commands.py

      - name: Verify CLI module
        run: uv run python -m sdd_cli --help > /dev/null

      - name: Validate MkDocs mapped paths
        run: uv run python tools/verify_mkdocs_paths.py

      - name: Validate active docs anchors
        run: uv run python -m sdd_cli lint spec --validate-all-anchors --strict-anchor-style

      - name: Validate PATH IA-first runtime schema
        run: uv run python tools/docs/check_runtime_path_schema.py

      - name: Check internal docs links (advisory baseline)
        continue-on-error: true
        run: uv run python tools/docs/check_links.py --mode ci

      - name: Check internal docs links (PR diff-aware blocking)
        if: github.event_name == 'pull_request'
        run: |
          uv run python tools/docs/check_links.py \
            --mode ci \
            --changed-files-from-git \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Markdown style advisory (non-blocking)
        continue-on-error: true
        run: npx --yes markdownlint-cli2 "docs/**/*.md"

      - name: Build documentation (strict)
        run: uv run mkdocs build --strict

      - name: Generate governance artifacts for selector
        continue-on-error: true
        run: uv run python -m sdd_cli governance generate --full-bootstrap

      - name: Build selector artifacts
        continue-on-error: true
        run: UV_CACHE_DIR=/tmp/uv-cache uv run python -m sdd_wizard.orchestration.wizard.selector_compiler --output-dir build/site/selector

      - name: Set up Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
        with:
          enablement: false

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
