[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sdd-telemetry"
dynamic = ["version"]
description = "High-performance telemetry and metrics engine for SDD Architecture"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "msgpack>=1.2.1",
]

[project.urls]
Repository = "https://github.com/SergioLacerda/sdd-harness"

[tool.hatch.version]
source = "vcs"
tag-pattern = "[vV](?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"
fallback-version = "0.0.0+unknown"
raw-options = { root = "../../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_telemetry"]
