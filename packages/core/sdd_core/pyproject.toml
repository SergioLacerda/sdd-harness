[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-core"
version = "1.0.0"
description = "Core domain model and contracts for SDD governance"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "msgpack>=1.2.1",
    "structlog>=23.0",
]

[project.urls]
Repository = "https://github.com/SergioLacerda/sdd-harness"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
sdd_core = ["py.typed", "mandate.spec", "guidelines.dsl", "_native/*"]

[tool.setuptools.packages.find]
where = ["src"]
