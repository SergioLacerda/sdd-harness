[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "providence-runtime"
dynamic = ["version"]
description = "Runtime execution engine for SDD governance"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "providence-skills>=1.0",
]

[project.optional-dependencies]
http = [
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/SergioLacerda/providence"

[tool.hatch.version]
source = "vcs"
tag-pattern = "[vV](?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"
fallback-version = "0.0.0+unknown"
raw-options = { root = "../../..", version_scheme = "no-guess-dev" }

[tool.hatch.build.targets.wheel]
packages = ["src/providence_runtime"]
