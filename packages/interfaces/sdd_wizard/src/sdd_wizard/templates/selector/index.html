<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDD Selector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <button id="toggle-lang" class="icon-btn" aria-label="Switch language">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="lang-label">PT</span>
      </button>
      <button id="toggle-theme" class="icon-btn" aria-label="Toggle theme">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
    <header class="hero">
      <svg class="brand-mark" viewBox="0 0 96 96" width="56" height="56" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="88" height="88" rx="20" fill="#4453bd"/>
        <path d="M34 26 H26 a4 4 0 0 0 -4 4 V66 a4 4 0 0 0 4 4 H34" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>
        <path d="M62 26 H70 a4 4 0 0 1 4 4 V66 a4 4 0 0 1 -4 4 H62" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>
        <path d="M38 49 L45 57 L59 39" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <h1>SDD Selector</h1>
      <p>Select governed items and export a JSON artifact.</p>
    </header>
    <section class="controls">
      <input id="search" type="search" placeholder="Search items">
      <div id="filters" class="filters"></div>
    </section>
    <section id="warnings" class="warnings hidden"></section>
    <section id="status" class="status hidden"></section>
    <section id="items" class="grid"></section>
    <footer class="actions">
      <span id="summary">0 selected</span>
      <button id="export" type="button">Export JSON</button>
      <button id="import" type="button">Import JSON</button>
      <button id="clear" type="button">Clear</button>
      <input id="import-file" type="file" accept="application/json" class="hidden">
    </footer>
  </main>
  <script src="selector.js"></script>
</body>
</html>
