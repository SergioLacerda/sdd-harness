[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-wizard"
version = "1.0.0"
description = "Interactive project scaffolding wizard for SDD workspaces"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "PyYAML>=6.0",
    "questionary>=2.0",
    "sdd-core",
    "sdd-compiler",
    "sdd-adapters",
]

[project.urls]
Repository = "https://github.com/SergioLacerda/sdd-harness"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
sdd_wizard = ["py.typed", "templates/**/*"]

[tool.setuptools.packages.find]
where = ["src"]
