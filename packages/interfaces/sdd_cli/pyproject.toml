[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-cli"
version = "1.0.0"
description = "Command-line interface for the SDD governance toolchain"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "click>=8.3.3",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "sdd-wizard",
    "sdd-integration",
    "sdd-runtime",
]

[project.scripts]
sdd = "sdd_cli.main:main"

[project.urls]
Repository = "https://github.com/SergioLacerda/sdd-harness"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
sdd_cli = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
