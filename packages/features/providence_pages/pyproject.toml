[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "providence-pages"
dynamic = ["version"]
description = "GitHub Pages publishing, compression, and index generation for SDD workspaces"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "PyYAML>=6.0",
    "typer>=0.9.0",
    "providence-core>=1.0",
]

[project.optional-dependencies]
brotli = ["brotli>=1.0.9"]

[project.urls]
Repository = "https://github.com/SergioLacerda/providence"

[tool.hatch.version]
source = "vcs"
tag-pattern = "[vV](?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"
fallback-version = "0.0.0+unknown"
raw-options = { root = "../../..", version_scheme = "no-guess-dev" }

[tool.hatch.build.targets.wheel]
packages = ["src/providence_pages"]
