name: sdd-diagnose
version: 1.0.0
category: analysis
description: Diagnose runtime/workspace problems with governed checks.
when_to_use:
- failing checks
- unknown workspace failures
outcomes:
- policy_result
- next_actions
allowed_tools:
- sdd doctor run
- sdd runtime status --force
cli_fallback:
- sdd doctor run
- sdd runtime status --force
required_permissions:
- workspace-read
execution_path: PATH_A
status: active
deprecated_after: null
sunset_after: null
risk_score: low
tags:
- analysis
- runtime
- soft-governance
budget_policy:
  token_budget: medium
  timeout_seconds: 120
  max_retries: 1
escalation_policy:
  mode: warn
  require_human_on:
  - critical_violation
  - repeat_failure
telemetry_policy:
  emit_runtime_event: true
  otel_required_if_enabled: true
validation_policy:
  require_preflight: true
  require_postcheck: true
schema_version: 1.0.0
deprecation_due: false
