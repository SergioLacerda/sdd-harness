[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-integration"
version = "1.0.0"
description = "End-to-end integration protocols and templates for SDD onboarding"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "sdd-core",
]

[project.urls]
Repository = "https://github.com/SergioLacerda/sdd-harness"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
sdd_integration = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
