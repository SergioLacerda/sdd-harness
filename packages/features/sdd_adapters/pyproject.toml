[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sdd-adapters"
dynamic = ["version"]
description = "Multi-agent adapter generator for SDD skills and commands"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "Jinja2>=3.1",
    "sdd-core>=1.0",
]

[project.urls]
Repository = "https://github.com/SergioLacerda/sdd-harness"

[tool.hatch.version]
source = "vcs"
tag-pattern = "[vV](?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"
fallback-version = "0.0.0+unknown"
raw-options = { root = "../../..", version_scheme = "no-guess-dev" }

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_adapters"]
