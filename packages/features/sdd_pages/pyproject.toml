[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-pages"
version = "1.0.0"
description = "GitHub Pages publishing, compression, and index generation for SDD workspaces"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Sergio Lacerda", email = "sergio.lacerda.vieira@gmail.com"},
]

dependencies = [
    "PyYAML>=6.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
brotli = ["brotli>=1.0.9"]

[project.urls]
Repository = "https://github.com/SergioLacerda/sdd-harness"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
sdd_pages = ["py.typed", "templates/*"]

[tool.setuptools.packages.find]
where = ["src"]
