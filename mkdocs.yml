site_name: SDD Harness
site_description: Executable governance platform for AI agents — compile, validate and audit architecture compliance at runtime
site_author: Sergio Lacerda
site_url: https://sergiolacerda.github.io/sdd-harness/docs/
# Nested under docs/ within the shared publication root so the Astro landing
# app (apps/landing/) can own the root `/` — see
# .analysis/archived/selector-landing-mkdocs-refinement-20260702-adr.md.
site_dir: build/site/docs

theme:
  name: material
  language: en
  # + IBM Plex (SDD Harness design system type pairing)
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  # Note: mkdocs-static-i18n replicates the page tree per locale (docs/pt/...)
  # but does not replicate MkDocs's root-only special files into each locale
  # subtree — docs/pt/sitemap.xml (and sitemap.xml.gz) will not exist; only
  # docs/sitemap.xml (default locale) is generated. This is expected upstream
  # plugin behavior, not a bug: no in-repo consumer requires a per-locale
  # sitemap today.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt
          name: Português
          build: true

# + design-system re-skin (lives at docs/app/sdd-theme.css)
extra_css:
  - app/sdd-theme.css
  # + shared dynamic site header, synced from apps/landing/public/shared/
  #   (see docs/app/site-header.js for the sync note)
  - app/site-header.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - app/site-header.js

nav:
  - Home: README.md
  # + the interactive Selector — absolute URL = external link, so navigation.instant
  #   leaves it alone. Generated by `make docs-build` (selector compiler runs
  #   directly to build/site/selector/, alongside this MkDocs build and the
  #   Astro landing app) and restyled by the design-system theme (see
  #   selector-theme/). See docs/guides/FRONTEND_SELECTOR.md.
  - Selector: https://sergiolacerda.github.io/sdd-harness/selector/
  - Getting Started:
    - Client Onboarding: guides/CLIENT_ONBOARDING.md
    - Contributing Setup: guides/ONBOARDING.md
    - FAQ: guides/FAQ.md
  - Guides:
    - Technical Guide: guides/TECHNICAL_GUIDE.md
    - Runtime API Integration: guides/RUNTIME_API_INTEGRATION.md
    - Frontend Selector: guides/FRONTEND_SELECTOR.md
    - Agent Entry Point Guide: guides/AGENT_GUIDE.md
    - .sdd/ Folder Reference: guides/SDD_FOLDER_REFERENCE.md
  - Reference:
    - CLI Commands: spec/reference/commands/cli.md
    - Security Policy: spec/reference/SECURITY.md
    - Context Template: spec/reference/templates/AI_CONTEXT_AWARE_TEMPLATE.md
    - Context Standards: spec/reference/templates/CONTEXT_MANAGEMENT_STANDARDS.md
    - Golden Files: spec/guides/golden-files.md
    - Commit Protocol (P003): spec/guides/commit-protocol.md
  - Architecture:
    - Overview: architecture/README.md
    - Clean Architecture: spec/canonical/features/CLEAN_ARCHITECTURE.md
    - TDD: spec/canonical/features/TDD.md
    - C4 Context (L1): architecture/c4-context.md
    - C4 Containers (L2): architecture/c4-containers.md
    - C4 Components — Runtime (L3): architecture/c4-components-runtime.md
  - Runtime:
    - Agent Entrypoint: runtime/protocols/AGENT_ENTRYPOINT.md
    - Agent Runtime Protocol: runtime/protocols/AGENT_RUNTIME_PROTOCOL.md
  - Governance:
    - Source And Runtime Model: governance-runtime-model.md
    - Mandatory Human Review: spec/canonical/core/policies/P003_MANDATORY_HUMAN_REVIEW.md
    - Honest Critique: spec/canonical/core/policies/P002_HONEST_CRITIQUE.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

validation:
  omitted_files: ignore

exclude_docs: |
  QUICKSTART_AGENT.md
  spec/canonical/INDEX.md
  cognition/**
  indices/**
  spec/canonical/concepts/**
  spec/canonical/core/cognition/**
  spec/canonical/core/generated/**
  spec/canonical/core/guardrails/**
  spec/canonical/core/mandates/**
  spec/canonical/core/policies/P001_PROJECT_BOUNDARY.md
  spec/canonical/core/rules/**
  spec/canonical/SEMANTIC_MAP.md
  spec/canonical/specifications/**
  spec/decisions/**
  spec/guides/adoption/**
  spec/guides/integration/**
  spec/guides/navigation/**
  spec/guides/onboarding/**
  spec/guides/operational/**
